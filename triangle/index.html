<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삼각형 탐험대 - 4학년 자기주도학습</title><style>body{margin:0;background:#f1f5fb;color:#203047;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:980px;margin:auto;padding:20px}header{background:linear-gradient(110deg,#2456a6,#18a6a2);color:white;padding:28px;border-radius:22px}h1{margin:0 0 8px}section{background:white;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 4px 14px #16345b12}button,select,input{font:inherit}button{border:0;background:#2456a6;color:white;border-radius:10px;padding:11px 16px;cursor:pointer;margin:4px}button.secondary{background:#e6eefb;color:#17427d}button:disabled{opacity:.5}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}select,input[type=number],input[type=text]{border:1px solid #a7b6ca;border-radius:9px;padding:9px;max-width:150px}.note{background:#e9f7f4;padding:12px;border-radius:12px;line-height:1.7}.question{border:1px solid #dce4ef;border-radius:14px;padding:18px;margin:14px 0}.question svg{max-width:100%;display:block;margin:10px auto}.options{display:flex;flex-wrap:wrap;gap:8px}.option{background:#f1f5fb;color:#243e66;border:2px solid transparent}.option.selected{border-color:#1c68bd;background:#dcecff}.correct{background:#e5f7ec!important;border-color:#299d59!important}.wrong{background:#ffe9e7!important;border-color:#d85b4f!important}.feedback{margin-top:10px;font-weight:600}.hidden{display:none}.small{font-size:.9em;color:#5a6b80}#progress{font-weight:bold}footer{text-align:center;color:#667;margin:30px}@media print{header,.controls,#actions,#lessonButtons,footer{display:none!important}section{box-shadow:none;break-inside:avoid}body{background:white}}
.visual-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin:14px 0}.visual-card{background:#fff;border:1px solid #cddfed;border-radius:14px;padding:12px;text-align:center}.visual-card svg{width:100%;max-width:210px;height:150px}.visual-card strong{display:block;color:#164d82}.visual-card small{display:block;color:#526579;line-height:1.5}.visual-card .shape{fill:#e4f5fa;stroke:#197b9b;stroke-width:3;stroke-linejoin:round}.visual-card .mark{stroke:#e06d39;stroke-width:2.7;stroke-linecap:round}.visual-card text{font-size:12px;fill:#24415c}.visual-card .arc{fill:none;stroke:#e06d39;stroke-width:2.4}.question .visual-card{max-width:280px;margin:12px auto}.question .visual-card svg{height:160px}
</style></head><body><main><header><h1>🔺 삼각형 탐험대</h1><div>초등학교 4학년 · 스스로 배우고, 풀고, 다시 도전해요!</div></header><section><h2>1. 삼각형 개념 탐험</h2><div class="controls" id="lessonButtons"><button onclick="lesson('side')">변으로 분류</button><button onclick="lesson('angle')">각으로 분류</button><button onclick="lesson('compare')">분류 비교</button></div><div id="lesson" class="note"></div><div id="conceptCheck" class="question"></div><div id="learningProgress" class="small" aria-live="polite"></div></section><section id="quizSection"><h2>2. 나만의 문제 풀기</h2><p id="lockNotice" class="note">🔒 먼저 개념 학습 3단계를 마치고 확인 문제를 맞혀 보세요.</p><div class="controls"><label>학습 범위 <select id="topic"><option value="all">전체 혼합</option><option value="side">변의 길이</option><option value="angle">각의 크기</option><option value="concept">개념·성질</option></select></label><label>난이도 <select id="level"><option value="easy">기초</option><option value="normal" selected>보통</option><option value="hard">도전</option></select></label><label>문제 수 <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><button onclick="generate()">새 문제 만들기</button></div><p class="small">그림을 보고 답을 클릭하거나 숫자를 입력하세요. 채점 후 틀린 문제를 다시 풀 수 있어요.</p><div id="progress"></div><div id="questions"></div><div id="actions" class="controls hidden"><button onclick="grade()">채점하기</button><button class="secondary" onclick="retry()">틀린 문제 다시 풀기</button><button class="secondary" onclick="showHints()">힌트 보기</button><button class="secondary" onclick="window.print()">인쇄하기</button></div><div id="result" aria-live="polite"></div></section><footer>로그인·인터넷 연결이 필요 없는 학습 프로그램 · 학습 결과는 서버에 전송되지 않습니다.</footer></main><script>
const visualData={
 equilateral:{name:'정삼각형',detail:'세 변의 길이가 같고, 세 각이 모두 60°',pts:[[110,18],[35,148],[185,148]],marks:[[72,83],[148,83],[110,148]],angle:'60°'},
 isosceles:{name:'이등변삼각형',detail:'두 변의 길이가 같고, 두 밑각의 크기가 같음',pts:[[110,18],[42,148],[178,148]],marks:[[76,83],[144,83]]},
 scalene:{name:'세 변이 다른 삼각형',detail:'세 변의 길이가 모두 다름',pts:[[66,20],[25,148],[195,148]]},
 acute:{name:'예각삼각형',detail:'세 각이 모두 90°보다 작음',pts:[[110,20],[25,148],[195,148]]},
 right:{name:'직각삼각형',detail:'한 각이 90°',pts:[[35,20],[35,148],[195,148]],right:true},
 obtuse:{name:'둔각삼각형',detail:'한 각이 90°보다 큼',pts:[[75,98],[20,148],[200,148]],obtuse:true},
 isoright:{name:'이등변직각삼각형',detail:'두 변이 같고 한 각이 90°',pts:[[40,20],[40,148],[168,148]],right:true}
};
function visualCard(key){const d=visualData[key],p=d.pts,pts=p.map(v=>v.join(',')).join(' ');let marks='';if(d.marks){for(const [x,y] of d.marks)marks+=`<path class="mark" d="M ${x-5} ${y-3} l 10 6"/>`;}let right=d.right?'<path class="arc" d="M35 128 H55 V148"/>':'';let obtuse=d.obtuse?'<path class="arc" d="M55 116 Q74 133 102 122"/>':'';return `<div class="visual-card"><svg viewBox="0 0 220 175" role="img" aria-label="${d.name} 그림"><polygon class="shape" points="${pts}"/>${marks}${right}${obtuse}${d.angle?'<text x="102" y="48">60°</text>':''}${d.right?'<text x="61" y="137">90°</text>':''}</svg><strong>${d.name}</strong><small>${d.detail}</small></div>`}
function gallery(k){const keys=k==='side'?['equilateral','isosceles','scalene']:k==='angle'?['acute','right','obtuse']:['equilateral','isoright','obtuse'];return '<div class="visual-gallery">'+keys.map(visualCard).join('')+'</div>'}
const lessons={side:`<b>변의 길이로 분류하기</b><br>• 이등변삼각형: 두 변의 길이가 같은 삼각형(세 변이 모두 같은 경우도 포함).<br>• 정삼각형: 세 변의 길이가 모두 같은 삼각형. 세 각의 크기도 모두 60°예요.<br>• 세 변의 길이가 모두 다른 삼각형도 있어요.<br><b>기억!</b> 정삼각형은 이등변삼각형의 성질도 갖고 있어요.`,angle:`<b>각의 크기로 분류하기</b><br>• 예각삼각형: 세 각이 모두 예각(90°보다 작음).<br>• 직각삼각형: 한 각이 직각(90°).<br>• 둔각삼각형: 한 각이 둔각(90°보다 크고 180°보다 작음).<br>• 삼각형의 세 각의 크기의 합은 180°예요.`,compare:`<b>두 가지 분류 기준을 함께 사용해요!</b><br>삼각형은 <b>변의 길이</b>로도, <b>각의 크기</b>로도 분류할 수 있어요.<br>예를 들어 두 변의 길이가 같은 직각삼각형은 <b>이등변삼각형이면서 직각삼각형</b>이에요.<br>정삼각형은 세 각이 60°이므로 언제나 예각삼각형이에요.`};
const conceptTasks={side:{question:'세 변의 길이가 모두 같은 삼각형은?',choices:['정삼각형','직각삼각형','둔각삼각형'],answer:0,reason:'정삼각형은 세 변의 길이가 모두 같아요.'},angle:{question:'한 각이 90°인 삼각형은?',choices:['예각삼각형','직각삼각형','둔각삼각형'],answer:1,reason:'90°인 각을 직각이라고 해요.'},compare:{question:'두 변의 길이가 같고 한 각이 90°인 삼각형은?',choices:['이등변삼각형이면서 직각삼각형','정삼각형이면서 둔각삼각형','예각삼각형만'],answer:0,reason:'변의 길이와 각의 크기로 각각 분류할 수 있어요.'}};
const conceptDone=new Set();let currentConcept='side';
function lesson(k){currentConcept=k;document.getElementById('lesson').innerHTML=lessons[k]+gallery(k);const t=conceptTasks[k];document.getElementById('conceptCheck').innerHTML=`<b>✏️ 개념 확인</b><p>${t.question}</p><div class="options">${t.choices.map((v,i)=>`<button class="option" onclick="checkConcept(${i})">${i+1}. ${v}</button>`).join('')}</div><p id="conceptFeedback" aria-live="polite"></p>`;updateConceptProgress()}
function checkConcept(i){const t=conceptTasks[currentConcept];const out=document.getElementById('conceptFeedback');if(i===t.answer){conceptDone.add(currentConcept);out.innerHTML=`<strong style="color:#16804d">정답이에요! ✓</strong> ${t.reason} ${conceptDone.size<3?'<br>다른 개념도 공부해 보세요.':'<br>🎉 이제 아래에서 문제를 풀 수 있어요!'}`;}else{out.innerHTML=`<strong style="color:#c23c32">다시 생각해 보세요.</strong> 위의 개념 설명을 읽고 다시 선택해요.`;}updateConceptProgress()}
function updateConceptProgress(){const names={side:'변으로 분류',angle:'각으로 분류',compare:'분류 비교'};document.getElementById('learningProgress').textContent=`학습 완료: ${conceptDone.size}/3단계 · ${Object.entries(names).map(([k,v])=>(conceptDone.has(k)?'✅ ':'⬜ ')+v).join(' / ')}`;const unlocked=conceptDone.size===3;document.getElementById('lockNotice').classList.toggle('hidden',unlocked);document.getElementById('quizSection').querySelectorAll('select,button').forEach(el=>{if(el.id!==''){}el.disabled=!unlocked});}
lesson('side');
let problems=[],answers=[],marked=false;const pick=a=>a[Math.floor(Math.random()*a.length)];const shuffle=a=>a.sort(()=>Math.random()-.5);
function diagram(type,labels){let points=type==='equilateral'?'110,15 25,160 195,160':type==='isosceles'?'110,15 35,160 185,160':type==='right'?'35,25 35,160 200,160':type==='obtuse'?'30,155 205,155 90,105':'25,150 205,150 135,20';let coords=points.split(' ').map(s=>s.split(',').map(Number));return `<svg viewBox="0 0 240 190" width="240" height="190" role="img" aria-label="삼각형 그림"><polygon points="${points}" fill="#e1f4f4" stroke="#167b9a" stroke-width="3"/>${coords.map((p,i)=>`<text x="${p[0]+(i===0?-9:5)}" y="${p[1]+(i===0?-5:18)}" fill="#183d65" font-size="13">${labels?.[i]||''}</text>`).join('')}</svg>`}
function q(prompt,choices,correct,explain,kind='choice',pic=''){return {prompt,choices,correct,explain,kind,pic}}
function make(topic,level){let bank=[];if(topic==='side'||topic==='all'){
let t=pick(['equilateral','isosceles','scalene']);let lengths=t==='equilateral'?[6,6,6]:t==='isosceles'?[5,5,8]:[4,6,8];bank.push(q(`세 변의 길이가 ${lengths.join('cm, ')}cm인 삼각형은?`,['정삼각형','이등변삼각형(정삼각형 제외)','세 변의 길이가 모두 다른 삼각형'],t==='equilateral'?0:t==='isosceles'?1:2,`변의 길이를 비교해 보세요. ${t==='equilateral'?'세 변이 모두 같아요.':t==='isosceles'?'두 변만 같아요.':'세 변이 모두 달라요.'}`));bank.push(q('정삼각형의 한 변이 7cm일 때 나머지 두 변의 길이의 합은 몇 cm인가요?',[],14,'정삼각형은 세 변의 길이가 같으므로 7+7=14예요.','number'));bank.push(q('그림을 보고 삼각형의 이름을 고르세요.',['정삼각형','이등변삼각형(정삼각형 제외)','직각삼각형'],1,'그림의 두 빗변 길이가 같아요.','choice',visualCard('isosceles')));bank.push(q('다음 중 반드시 두 변의 길이가 같은 삼각형은?', ['이등변삼각형','직각삼각형','둔각삼각형'],0,'이등변삼각형은 두 변의 길이가 같은 삼각형이에요.'));bank.push(q('그림 속 삼각형은 어떤 삼각형일까요? (세 변의 길이가 같음)',['정삼각형','직각삼각형','둔각삼각형'],0,'세 변의 길이가 같으면 정삼각형이에요.','choice',visualCard('equilateral')));
}if(topic==='angle'||topic==='all'){
let ang=pick([[60,60,60],[90,35,55],[110,30,40],[75,65,40]]);let type=ang.some(x=>x===90)?'직각삼각형':ang.some(x=>x>90)?'둔각삼각형':'예각삼각형';bank.push(q(`세 각의 크기가 ${ang.join('°, ')}°인 삼각형은?`,['예각삼각형','직각삼각형','둔각삼각형'],['예각삼각형','직각삼각형','둔각삼각형'].indexOf(type),'90°와 비교하여 분류해요.'));let a=pick([35,45,60,70]);let b=pick([40,55,65]);bank.push(q(`삼각형의 두 각이 ${a}°, ${b}°일 때 나머지 한 각은 몇 도인가요?`,[],180-a-b,`180-${a}-${b}=${180-a-b}°예요.`,'number'));bank.push(q('그림 속 삼각형을 각의 크기에 따라 분류하면?',['예각삼각형','직각삼각형','둔각삼각형'],1,'그림의 네모 표시가 직각을 뜻해요.','choice',visualCard('right')));bank.push(q('직각삼각형에는 직각이 몇 개 있나요?',[],1,'삼각형에서 직각은 하나만 있을 수 있어요.','number'));bank.push(q('한 각이 120°인 삼각형은?',['예각삼각형','직각삼각형','둔각삼각형'],2,'120°는 둔각이므로 둔각삼각형이에요.','choice',visualCard('obtuse')));
}if(topic==='concept'||topic==='all'){
bank.push(q('정삼각형의 한 각은 몇 도인가요?',[],60,'180°를 3으로 나누면 60°예요.','number'));bank.push(q('그림의 삼각형은 변의 길이와 각의 크기로 각각 무엇일까요?',['이등변삼각형과 직각삼각형','정삼각형과 둔각삼각형','세 변이 다른 삼각형과 예각삼각형'],0,'두 직각변이 같고 한 각이 90°예요.','choice',visualCard('isoright')));bank.push(q('정삼각형은 예각삼각형인가요?',['예','아니요'],0,'세 각이 모두 60°이므로 예각삼각형이에요.'));bank.push(q('직각삼각형이면서 이등변삼각형일 수 있나요?',['예','아니요'],0,'45°, 45°, 90°인 삼각형이 그 예예요.'));bank.push(q('세 각이 모두 90°인 삼각형을 만들 수 있나요?',['가능해요','불가능해요'],1,'세 각의 합은 180°인데 90°가 세 개면 270°예요.'));bank.push(q('이등변삼각형에서 길이가 같은 두 변에 마주 보는 두 각은?', ['크기가 같아요','크기가 달라요','항상 직각이에요'],0,'이등변삼각형의 두 밑각의 크기는 같아요.'));
}if(level==='hard'){bank.push(q('두 각이 45°, 45°인 삼각형은 어떤 두 종류에 모두 해당할까요?',['이등변삼각형과 직각삼각형','정삼각형과 둔각삼각형','정삼각형과 직각삼각형'],0,'나머지 각은 90°이고 두 각이 같으므로 이등변직각삼각형이에요.'));bank.push(q('두 변이 각각 5cm, 5cm이고 나머지 한 변이 8cm일 때 둘레는 몇 cm인가요?',[],18,'5+5+8=18cm예요.','number'))}if(level==='easy')bank=bank.filter(x=>x.kind==='choice');return pick(bank)}
function generate(){if(conceptDone.size<3){alert('개념 학습 3단계를 먼저 완료해 주세요.');return;}let topic=document.getElementById('topic').value,level=document.getElementById('level').value,n=+document.getElementById('count').value;problems=[];let used=new Set(),tries=0;while(problems.length<n&&tries++<500){let p=make(topic,level),id=p.prompt;if(!used.has(id)){used.add(id);problems.push(p)}}while(problems.length<n)problems.push(make(topic,level));answers=Array(n).fill(null);marked=false;render();document.getElementById('result').innerHTML='';document.getElementById('actions').classList.remove('hidden')}
function render(){document.getElementById('progress').textContent=`푼 문제: ${answers.filter(x=>x!==null&&x!=='').length} / ${problems.length}`;document.getElementById('questions').innerHTML=problems.map((p,i)=>`<div class="question" id="q${i}"><b>${i+1}. ${p.prompt}</b>${p.pic||''}<div class="options">${p.kind==='number'?`<input type="number" inputmode="numeric" aria-label="${i+1}번 정답" value="${answers[i]??''}" oninput="setAnswer(${i},this.value)">`:p.choices.map((c,j)=>`<button class="option ${answers[i]===j?'selected':''}" onclick="setAnswer(${i},${j})">${j+1}. ${c}</button>`).join('')}</div><div class="feedback" id="f${i}"></div></div>`).join('')}
function setAnswer(i,v){answers[i]=v;marked=false;document.getElementById('result').textContent='';if(problems[i].kind==='choice')render();else document.getElementById('progress').textContent=`푼 문제: ${answers.filter(x=>x!==null&&x!=='').length} / ${problems.length}`}
function isRight(p,a){return p.kind==='number'?a!==null&&a!==''&&Number(a)===p.correct:a===p.correct}
function grade(){marked=true;let right=0;problems.forEach((p,i)=>{let ok=isRight(p,answers[i]);if(ok)right++;let f=document.getElementById('f'+i);f.className='feedback '+(ok?'correct':'wrong');f.textContent=ok?'정답! 잘했어요!':'다시 생각해 보세요. '+p.explain;});document.getElementById('result').innerHTML=`<h2>🎉 ${right} / ${problems.length}문제 정답 · ${Math.round(right/problems.length*100)}점</h2><p>${right===problems.length?'완벽해요! 다음 난이도에 도전해 보세요.':'틀린 문제를 다시 풀며 실력을 키워요!'}</p>`}
function retry(){if(!marked){alert('먼저 채점해 주세요.');return}let wrong=problems.map((p,i)=>({p,a:answers[i]})).filter(x=>!isRight(x.p,x.a));if(!wrong.length){alert('모두 맞혔어요! 새로운 문제에 도전해 보세요.');return}problems=wrong.map(x=>x.p);answers=Array(problems.length).fill(null);marked=false;render();document.getElementById('result').textContent='틀린 문제만 모았어요. 다시 도전!'}
function showHints(){problems.forEach((p,i)=>document.getElementById('f'+i).textContent='💡 힌트: '+p.explain.replace(/\d+°?예요\./g,'생각해 보세요.'))}
/* 개념을 학습한 뒤 문제 생성 버튼으로 시작합니다. */</script></body></html>
