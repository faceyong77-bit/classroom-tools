<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분수 탐험대 | 4학년 자기주도학습</title><style>:root{font-family:'Malgun Gothic',system-ui,sans-serif;color:#203047;background:#f2f6ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1020px;margin:auto;padding:22px}header{background:linear-gradient(120deg,#3357bd,#7a50c7);color:white;padding:28px;border-radius:20px}h1{margin:0 0 8px}h2{margin:0 0 14px}h3{margin:14px 0 8px}.tabs,.controls,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.panel,.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #20304712}.card{border:1px solid #e2e9f7;margin:12px 0}.tab,button,select,input{font:inherit}button{border:0;background:#365fcb;color:white;border-radius:10px;padding:11px 17px;cursor:pointer;font-weight:700}button:hover{filter:brightness(.95)}button.secondary{background:#e8eefc;color:#284687}.tab{background:#dfe8fc;color:#234}.tab.active{background:#365fcb;color:white}select,input{padding:9px;border:1px solid #bac9e3;border-radius:9px}input[type=number]{width:82px;text-align:center}input[type=text]{max-width:130px}.muted{color:#64748b}.pill{display:inline-block;background:#e7efff;border-radius:50px;padding:5px 12px;color:#264eab;font-size:14px}.figure{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0}.strip{display:inline-grid;width:min(290px,100%);height:55px;border:2px solid #50627e;border-radius:7px;overflow:hidden}.cell{border-right:1px solid #50627e;background:#fff}.cell:last-child{border-right:0}.cell.fill{background:#78b5fa}.fraction{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;font-size:22px;min-width:25px;line-height:1.2}.fraction span:first-child{border-bottom:2px solid currentColor;width:100%;text-align:center}.fraction span:last-child{width:100%;text-align:center}.equation{font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.question{font-size:19px;font-weight:700;margin:12px 0}.feedback{margin-top:10px;padding:10px;border-radius:9px;background:#eef4ff}.correct{color:#16733b}.wrong{color:#c03936}.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.answer label{font-size:14px}.progress{height:12px;background:#e4eaf4;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#4e9d7e;transition:width .2s}.hidden{display:none!important}.hint{background:#fff8e5;padding:12px;border-left:4px solid #e5ae3b;border-radius:8px}footer{padding:20px;text-align:center;color:#718096}@media print{header,.tabs,.controls,.actions,button{display:none!important}.panel{box-shadow:none}body{background:white}}@media(max-width:600px){.wrap{padding:10px}.panel{padding:15px}.equation{font-size:20px}}</style></head><body><main class="wrap"><header><h1>🍰 분수 탐험대</h1><div>초등학교 4학년 | 그림으로 이해하고 직접 풀어 보는 분수·덧셈·뺄셈</div><p>로그인 없이, 인터넷 없이, 혼자서 차근차근!</p></header><nav class="tabs"><button class="tab active" data-page="learn">① 개념 익히기</button><button class="tab" data-page="check">② 개념 확인</button><button class="tab" data-page="practice">③ 문제 풀기</button><button class="tab" data-page="review">④ 오답 복습</button></nav><section id="learn" class="panel"><h2>그림으로 개념 익히기</h2><p class="muted">주제를 선택하고 색칠된 부분을 살펴보세요. 아래 그림은 모두 같은 크기의 전체를 기준으로 합니다.</p><div class="controls"><label>학습 주제 <select id="topic"><option value="meaning">분수의 뜻과 종류</option><option value="compare">분수의 크기와 1</option><option value="add">분모가 같은 분수의 덧셈</option><option value="sub">분모가 같은 분수의 뺄셈</option><option value="mixed">대분수의 덧셈과 뺄셈</option></select></label></div><div id="lesson"></div><div class="actions"><button id="nextTopic">다음 개념 보기 →</button><button class="secondary" data-go="check">개념 확인 문제 풀기</button></div></section><section id="check" class="panel hidden"><h2>개념 확인</h2><p>각 주제의 핵심 개념을 확인해 보세요. 틀려도 해설을 보고 다시 시도할 수 있어요.</p><div id="checkBody"></div><div class="actions"><button id="checkGrade">개념 확인 채점</button><button class="secondary" id="checkReset">다른 확인 문제</button><button class="secondary" data-go="practice">문제 풀이로 이동 →</button></div></section><section id="practice" class="panel hidden"><h2>스스로 문제 풀기</h2><div class="controls"><label>범위 <select id="range"><option value="all">전체 혼합</option><option value="meaning">분수의 개념</option><option value="compare">분수 비교</option><option value="add">덧셈</option><option value="sub">뺄셈</option><option value="mixed">대분수 계산</option></select></label><label>난이도 <select id="level"><option value="easy">기초</option><option value="normal" selected>보통</option><option value="hard">도전</option></select></label><label>문제 수 <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select></label><button id="generate">새 문제 만들기</button></div><div class="progress"><div id="bar" style="width:0%"></div></div><p id="status" class="muted"></p><div id="problems"></div><div class="actions"><button id="grade">채점하기</button><button class="secondary" id="retry">틀린 문제 다시 풀기</button><button class="secondary" id="reveal">정답·해설 보기</button></div><div id="score"></div></section><section id="review" class="panel hidden"><h2>오답 복습</h2><p>마지막 채점에서 틀렸던 문제를 다시 풀어 봅니다.</p><div id="reviewBody"></div><div class="actions"><button id="reviewGrade">오답 다시 채점</button><button class="secondary" data-go="practice">문제 풀이로 돌아가기</button></div></section><footer>학생의 답안은 외부로 전송되지 않습니다. 학습 기록은 현재 화면에서만 유지됩니다.</footer></main><script>
const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choice=a=>a[rand(0,a.length-1)],gcd=(a,b)=>b?gcd(b,a%b):a;
function f(n,d){return `<span class="fraction"><span>${n}</span><span>${d}</span></span>`}function strip(n,d){let cells='';for(let i=0;i<d;i++)cells+=`<span class="cell ${i<n?'fill':''}"></span>`;return `<span class="strip" style="grid-template-columns:repeat(${d},1fr)">${cells}</span>`}function strips(n,d){let html='<div class="figure">';while(n>0){let take=Math.min(n,d);html+=strip(take,d);n-=take}return html+'</div>'}function fractionText(n,d){if(n===0)return '0';let whole=Math.floor(n/d),r=n%d;return whole?(r?`${whole}와 ${r}/${d}`:`${whole}`):`${r}/${d}`}
const lessons={meaning:['분수의 뜻과 종류',`전체를 똑같이 나눈 부분을 분수로 나타내요. 분모는 똑같이 나눈 수, 분자는 선택한 부분의 수예요.`,`${strips(3,5)} ${f(3,5)}은 5부분 중 3부분이에요.<h3>진분수·가분수·대분수</h3>${strips(7,4)} ${f(7,4)} = 1과 ${f(3,4)}<p>진분수: 분자가 분모보다 작음 / 가분수: 분자가 분모보다 크거나 같음 / 대분수: 자연수와 진분수로 나타냄.</p>`],compare:['분수의 크기와 1',`분모가 같을 때는 분자가 큰 분수가 더 커요. 분모가 다르면 같은 크기의 부분으로 나누어 비교해야 해요.`,`<p>${f(2,5)} ${strip(2,5)}</p><p>${f(4,5)} ${strip(4,5)}</p><p>따라서 ${f(2,5)} &lt; ${f(4,5)} 입니다.</p><p>${f(5,5)} = 1, ${f(7,5)} = 1과 ${f(2,5)}입니다.</p>`],add:['분모가 같은 분수의 덧셈',`똑같이 나눈 조각을 합하므로 분모는 그대로 두고 분자끼리 더해요.`,`<div class="equation">${f(2,6)} + ${f(3,6)} = ${f(5,6)}</div><p>첫 번째 분수</p>${strip(2,6)}<p>두 번째 분수</p>${strip(3,6)}<p>합친 부분</p>${strip(5,6)}<p class="hint">분모끼리 더하지 않아요!</p>`],sub:['분모가 같은 분수의 뺄셈',`전체를 같은 크기로 나눈 조각 중에서 일부를 빼요. 분모는 그대로 두고 분자끼리 빼요.`,`<div class="equation">${f(5,7)} − ${f(2,7)} = ${f(3,7)}</div><p>처음 부분</p>${strip(5,7)}<p>빼고 남은 부분</p>${strip(3,7)}<p class="hint">남은 조각의 수를 세어 보세요.</p>`],mixed:['대분수의 덧셈과 뺄셈',`자연수 부분과 분수 부분을 각각 계산하거나 가분수로 바꾸어 계산할 수 있어요. 빼기에서 분수 부분이 부족하면 자연수 1을 분모만큼의 조각으로 바꾸어 빌려와요.`,`<p>1과 ${f(3,5)} + ${f(4,5)} = 2와 ${f(2,5)}</p>${strips(12,5)}<p>2와 ${f(1,4)} − ${f(3,4)} = 1과 ${f(2,4)}</p><p>2와 1/4 = 1과 5/4 이므로, 5/4 − 3/4 = 2/4입니다.</p><p class="hint">답이 가분수라면 대분수로 나타낼 수도 있어요. 같은 크기라면 둘 다 정답으로 인정합니다.</p>`]};
function renderLesson(){let [title,desc,visual]=lessons[$('topic').value];$('lesson').innerHTML=`<div class="card"><h2>${title}</h2><p>${desc}</p>${visual}</div>`}function go(id){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===id));window.scrollTo(0,0)}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>go(x.dataset.page));document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));$('topic').onchange=renderLesson;$('nextTopic').onclick=()=>{let s=$('topic');s.selectedIndex=(s.selectedIndex+1)%s.options.length;renderLesson()};renderLesson();
function makeQuestion(type,level){let d=rand(3,level==='easy'?6:level==='hard'?12:9),a,b,correct,prompt,visual='',explain='',kind='number';if(type==='meaning'){d=rand(3,9);a=rand(1,level==='easy'?d-1:d+5);correct=a;prompt=`그림의 색칠된 부분을 ${d}분의 □로 나타낼 때 □에 들어갈 수는?`;visual=strips(a,d);explain=`${d}개씩 똑같이 나눈 한 묶음에서 색칠한 조각을 모두 세면 ${a}개입니다.`}else if(type==='compare'){a=rand(1,d+2);b=rand(1,d+2);if(a===b)b++;correct=a>b?'>':'<';kind='compare';prompt='두 분수 사이에 알맞은 부등호를 고르세요.';visual=`<div class="equation">${f(a,d)} <strong>□</strong> ${f(b,d)}</div>${level==='easy'?`${strip(a,d)} ${strip(b,d)}`:''}`;explain=`분모가 ${d}로 같으므로 분자 ${a}와 ${b}를 비교해요.`}else if(type==='add'||type==='sub'){a=rand(1,d-1);b=rand(1,d-1);if(type==='sub'&&a<b)[a,b]=[b,a];correct=type==='add'?a+b:a-b;prompt=`다음 계산의 답을 구하세요. (분자는 분모 아래 입력)`;visual=`<div class="equation">${f(a,d)} ${type==='add'?'+':'−'} ${f(b,d)} = ?</div>${level==='easy'?`<p>첫 번째 분수</p>${strips(a,d)}<p>두 번째 분수</p>${strips(b,d)}`:''}`;kind='fraction';explain=`분모 ${d}는 그대로, 분자끼리 ${type==='add'?'더하면':'빼면'} ${correct}입니다. 정답은 ${fractionText(correct,d)}.`}else{d=rand(3,level==='hard'?10:7);let w1=rand(1,3),w2=rand(0,2);a=w1*d+rand(1,d-1);b=w2*d+rand(1,d-1);let op=choice(['+','−']);if(op==='−'&&a<b)[a,b]=[b,a];correct=op==='+'?a+b:a-b;kind='fraction';prompt='대분수의 계산 결과를 구하세요.';visual=`<div class="equation">${Math.floor(a/d)}와 ${f(a%d,d)} ${op} ${w2?`${w2}와 `:''}${f(b%d,d)} = ?</div>`;explain=`가분수로 바꾸면 ${a}/${d} ${op} ${b}/${d} = ${correct}/${d}입니다. 답은 ${fractionText(correct,d)}.`}return {type,kind,d,correct,prompt,visual,explain}}
function makeSet(count,range,level){let types=range==='all'?['meaning','compare','add','sub','mixed']:[range];return Array.from({length:count},(_,i)=>makeQuestion(types[i%types.length],level)).sort(()=>Math.random()-.5)}function answerHTML(q,i,prefix){if(q.kind==='compare')return `<select id="${prefix}${i}"><option value="">선택</option><option value="<">&lt;</option><option value=">">&gt;</option></select>`;if(q.kind==='fraction')return `<div class="answer"><label>자연수 <input aria-label="자연수" type="number" min="0" id="${prefix}${i}w" placeholder="0"></label><label>분자 <input aria-label="분자" type="number" min="0" id="${prefix}${i}n" placeholder="분자"></label><label>분모 <input aria-label="분모" type="number" min="1" id="${prefix}${i}d" placeholder="분모"></label></div><small class="muted">자연수가 없으면 0 또는 빈칸, 답이 자연수면 분자·분모는 비워 두세요.</small>`;return `<input type="number" id="${prefix}${i}" aria-label="${i+1}번 정답" placeholder="숫자 입력">`}
function renderQuestions(arr,target,prefix){$(target).innerHTML=arr.map((q,i)=>`<article class="card"><div class="quiz-head"><span class="pill">문제 ${i+1}</span><small>${{meaning:'분수 이해',compare:'크기 비교',add:'덧셈',sub:'뺄셈',mixed:'대분수'}[q.type]}</small></div><div class="question">${q.prompt}</div><div class="figure">${q.visual}</div>${answerHTML(q,i,prefix)}<div id="${prefix}fb${i}" class="feedback hidden"></div></article>`).join('')}
function isCorrect(q,i,prefix){if(q.kind==='fraction'){let w=$(`${prefix}${i}w`).value,n=$(`${prefix}${i}n`).value,d=$(`${prefix}${i}d`).value;if(n===''&&d==='')return (w!==''&&Number(w)*q.d===q.correct);if(n===''||d===''||Number(d)<=0)return false;return (w===''?0:Number(w))*q.d*Number(d)+Number(n)*q.d===q.correct*Number(d)}let val=$(`${prefix}${i}`).value;return val!==''&&(q.kind==='compare'?val===q.correct:Number(val)===q.correct)}let current=[],missed=[],checkQuestions=[];function gradeSet(arr,prefix,feedback=true){let right=0,wrong=[];arr.forEach((q,i)=>{let ok=isCorrect(q,i,prefix);if(ok)right++;else wrong.push(q);if(feedback){let el=$(`${prefix}fb${i}`);el.classList.remove('hidden');el.innerHTML=`<b class="${ok?'correct':'wrong'}">${ok?'✓ 정답입니다!':'✗ 다시 생각해 보세요.'}</b><p>${q.explain}</p>`}});return {right,wrong}}function makeCheck(){checkQuestions=['meaning','compare','add','sub','mixed'].map(t=>makeQuestion(t,'easy'));renderQuestions(checkQuestions,'checkBody','c')}$('checkGrade').onclick=()=>{let r=gradeSet(checkQuestions,'c');alert(`개념 확인: ${r.right}/5문제 정답! ${r.right===5?'훌륭해요! 문제 풀이에 도전하세요.':'해설을 읽고 다시 도전해 보세요.'}`)};$('checkReset').onclick=makeCheck;makeCheck();
function makePractice(){current=makeSet(Number($('count').value),$('range').value,$('level').value);missed=[];renderQuestions(current,'problems','p');$('score').innerHTML='';$('status').textContent=`총 ${current.length}문제 · 답을 직접 입력하고 채점하기를 누르세요.`;$('bar').style.width='0%'}$('generate').onclick=makePractice;$('grade').onclick=()=>{let r=gradeSet(current,'p');missed=r.wrong;$('bar').style.width=`${r.right/current.length*100}%`;$('score').innerHTML=`<div class="card"><h2>🎉 ${Math.round(r.right/current.length*100)}점</h2><p>정답 ${r.right}개 / ${current.length}문제 · 오답 ${missed.length}개</p><p>${missed.length?'틀린 문제를 다시 풀며 실력을 키워 봐요.':'모두 맞혔어요! 새로운 문제에도 도전해 보세요.'}</p></div>`};$('retry').onclick=()=>{if(!missed.length){alert('먼저 채점하여 오답을 확인하세요.');return}renderQuestions(missed,'reviewBody','r');go('review')};$('reviewGrade').onclick=()=>{let r=gradeSet(missed,'r');$('reviewBody').insertAdjacentHTML('beforeend',`<div class="card"><b>복습 결과: ${r.right}/${missed.length}문제 정답</b></div>`);missed=r.wrong};$('reveal').onclick=()=>current.forEach((q,i)=>{let el=$(`pfb${i}`);el.classList.remove('hidden');el.innerHTML=`<b>정답 해설</b><p>${q.explain}</p>`});makePractice();
</script></body></html>
