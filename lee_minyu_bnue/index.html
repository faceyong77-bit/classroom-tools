<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>이민유 부산교대 가자</title>
<style>
:root{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#182b37;background:#edf2ef;--ink:#182b37;--muted:#50636b;--line:#dbe5e1;--green:#126047;--soft:#e4f2e9;--paper:#fff;--navy:#132d38}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.46}button,select,a{-webkit-tap-highlight-color:transparent}:focus-visible{outline:3px solid #277db6;outline-offset:3px}button{touch-action:manipulation}[hidden]{display:none!important}
.shell{width:min(1136px,calc(100% - 48px));margin:auto}
header{background:var(--navy);color:#fff;padding:47px 0 37px;border-bottom:5px solid #8bcbae}
.header-inner{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
header h1{margin:0;font-size:clamp(2rem,4.6vw,3.75rem);letter-spacing:-.065em;line-height:1.12}
header p{margin:14px 0 0;color:#d2e5e1;font-size:1rem;line-height:1.6}
.total{color:#d0e9dc;white-space:nowrap;font-size:.91rem}
main{padding:29px 0 35px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.chip,.button,.question-link,.picker{border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.chip{padding:9px 15px;border-radius:999px;font-size:.88rem;font-weight:700;min-height:42px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:white}
.button,.picker{border-radius:10px;min-height:44px;padding:9px 14px;font-weight:700}
.button:hover:not(:disabled),.chip:hover:not([aria-pressed="true"]){background:#eff7f2}
.button.primary{color:#fff;background:var(--green);border-color:var(--green)}
.button.primary:hover:not(:disabled){background:#0b4f39}
.layout{display:grid;grid-template-columns:minmax(230px, .84fr) minmax(0, 2.6fr);align-items:start;gap:20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px}
aside{padding:17px 12px}
aside h2{font-size:1rem;margin:0 8px 13px}
#question-list,.variants{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.topic-group{border-bottom:1px solid var(--line)}
.topic-group:last-child{border-bottom:0}
.topic-group summary{padding:10px 7px;min-height:44px;font-size:.895rem;font-weight:800;cursor:pointer;border-radius:8px}
.topic-group summary:hover,.topic-group[open] summary{color:var(--green)}
.variants{padding:0 0 6px 11px}
.question-link{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:10px 8px;min-height:44px;border-radius:9px;border-color:transparent;font-size:.895rem;line-height:1.4}
.question-link span{color:var(--muted);font-size:.77rem;font-variant-numeric:tabular-nums}
.question-link:hover,.question-link[aria-current="true"]{background:var(--soft);color:#104d38}.question-link[aria-current="true"]{font-weight:800}
.mobile-picker{display:none}
.workspace{min-width:0;display:grid;gap:14px}
.prompt{padding:clamp(18px,4vw,32px)}
.eyebrow{color:var(--green);font-size:.86rem;font-weight:800;margin:0 0 11px}
.prompt h2{font-size:clamp(1.25rem,3vw,1.85rem);letter-spacing:-.035em;line-height:1.42;margin:0;overflow-wrap:break-word;word-break:keep-all}
.timer-box{margin-top:24px;background:#edf5f0;border:1px solid #dce9e1;border-radius:13px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:9px 20px}
.timer-top span:first-child{color:var(--muted);font-size:.8rem;display:block}
.time{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.045em}
.timer-box.urgent .time{color:#a72e2b}
.timer-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.meter{grid-column:1/-1;width:100%;height:6px;border:none;border-radius:10px;overflow:hidden;background:#d4e4db;display:block;appearance:none}
.meter::-webkit-progress-bar{background:#d4e4db}.meter::-webkit-progress-value{background:#238263}.meter::-moz-progress-bar{background:#238263}
.timer-message{grid-column:1/-1;color:var(--muted);font-size:.86rem;margin:0;min-height:1.3em}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.answer{padding:clamp(18px,4vw,30px)}
.answer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.answer h2{font-size:1.13rem;margin:0}
.answer-head .button{font-size:.87rem}
.script{margin-top:17px;line-height:1.82;overflow-wrap:break-word;word-break:keep-all}
.script p{margin:0 0 .8em}.script p:last-child{margin:0}.script strong{color:var(--green)}
.reference{padding:12px 0 0;margin:18px 0 0;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}a{color:var(--green);text-underline-offset:3px}
.copy-status{margin:10px 0 0;color:var(--green);font-size:.85rem}.copy-status:empty{display:none}
.footer{margin:23px 0 0;font-size:.85rem;color:var(--muted);line-height:1.6}
@media(max-width:780px){
.shell{width:calc(100% - 30px)}header{padding:31px 0 25px}.header-inner{display:block}.total{display:none}
main{padding-top:19px}.layout{display:block}.layout aside{display:none}
.mobile-picker{display:block}.picker{width:100%}
.toolbar{align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
}
@media(max-width:380px){.shell{width:calc(100% - 22px)}.chip{padding-inline:11px}.timer-box{gap:8px;padding-inline:10px}.timer-controls{gap:5px}.button{padding-inline:9px}}
</style>
<style>
:root{--ink:#173343;--muted:#4d626e;--line:#dce9ec;--green:#10604c;--soft:#dff5eb;--paper:#fff;color:var(--ink);background:#f0f9f8}
body{min-height:100vh;background:linear-gradient(155deg,#f0fbf6,#edf7fc 64%,#f5fcfb)}
header{position:relative;overflow:hidden;background:linear-gradient(114deg,#d8f7e8,#e0f5fa 65%,#d7edfe);color:var(--ink);border-bottom:1px solid #cce9e6;padding:50px 0 42px}
.header-inner{position:relative;z-index:1}
header::after{content:"";position:absolute;width:420px;height:420px;border:68px solid rgba(255,255,255,.35);border-radius:50%;right:-100px;top:-234px;pointer-events:none}
header h1{font-size:clamp(2.1rem,5.2vw,4rem);line-height:1.14;word-break:keep-all}
header p{color:#395969}
.total{border:1px solid #b9dfd7;background:#f8fffc;color:#185647;border-radius:999px;padding:8px 13px;font-weight:750}
main{padding-top:25px}
.panel{border-radius:20px;border-color:#dcecef;box-shadow:0 10px 30px rgba(32,77,91,.06)}
.button,.picker{border-radius:12px;border-color:#d5e8e9}
.chip{border-color:#d5e8e9}
.chip[aria-pressed="true"],.button.primary{background:#12654e;border-color:#12654e;color:#fff}
.button.primary:hover:not(:disabled){background:#0d513e}
.question-link:hover,.question-link[aria-current="true"]{background:#def5eb;color:#104b3d}
.topic-group[open] summary{background:#f0faf7}
.timer-box{background:linear-gradient(105deg,#eaf9f1,#eaf5fc);border-color:#d9eaf0;padding-block:16px}
.timer-top span:first-child{color:#405c68}
.time{font-size:clamp(2.25rem,6vw,2.85rem);letter-spacing:-.055em}
.meter{background:#cfe4e4}
.meter::-webkit-progress-bar{background:#cfe4e4}
.meter::-webkit-progress-value{background:#23806a}
.meter::-moz-progress-bar{background:#23806a}
.answer-head .button{border-color:#c6e8df;color:#105744;background:#edf9f4}
.answer-head .button:hover{background:#def5eb}
#practice-note{padding:9px 12px;margin:15px 0 0;border:1px solid #cfe8ed;border-radius:10px;background:#eff9fc;color:#274957;line-height:1.6}
@media(max-width:780px){header{padding:34px 0 25px}header p{margin-top:9px}.total{display:inline-block;margin-top:13px;font-size:.8rem}main{padding-top:18px}.timer-box{padding-block:13px}}
</style>
<style>
.app-actions{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.file-tools{border:1px solid var(--line);border-radius:12px;background:white;padding:8px 12px;max-width:100%;min-height:44px;color:var(--ink)}
.file-tools summary{cursor:pointer;font-weight:700;line-height:26px}.file-tools label{display:block;font-size:.85rem;margin:7px 0}
.file-tools input{max-width:100%}.file-tools p{font-size:.85rem;margin:7px 0 0}.file-tools p:empty{display:none}
#pdf-dialog{width:min(970px,calc(100% - 22px));max-width:none;max-height:92vh;padding:0;border:1px solid #cde3e5;border-radius:15px;background:#f3fafb;color:var(--ink);box-shadow:0 18px 65px #163a4b40}
#pdf-dialog::backdrop{background:#17334390}
.pdf-top,.pdf-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px}
.pdf-top{justify-content:space-between;background:#e4f8ef}.pdf-top h2{font-size:clamp(1rem,3vw,1.35rem);margin:0}
.pdf-controls{background:white;border-bottom:1px solid var(--line)}
#pdf-status{margin:8px 14px;font-size:.9rem;color:var(--muted)}#pdf-status:empty{display:none}
#pdf-save{margin-left:auto}.pdf-sheet{padding:12px}.pdf-sheet canvas{display:block;width:min(100%,780px);height:auto;margin:auto;background:#fff;border:1px solid var(--line)}
#pdf-count{font-variant-numeric:tabular-nums}
</style>
<style>.screen-reader{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:pre-wrap}#pdf-jump{max-width:100%}</style>

<style>
#picker-dialog{width:min(28rem,calc(100% - 28px));padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink)}
#picker-dialog::backdrop{background:#17334390}
.picker-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.picker-header h2{margin:0;font-size:1.1rem}
#picker{width:100%;margin-bottom:12px}
@media(max-width:780px){
  .question-heading{display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:start;gap:12px}
  .question-text{min-width:0}
  #picker-open{margin:0;padding-inline:9px;white-space:nowrap;font-size:.82rem;background:var(--soft);color:var(--green);border-color:#c6e8df}
  .question-text .eyebrow{margin-bottom:6px}
}
</style>
<style>.answer-label{display:block;margin:12px 0 3px;font-size:.88rem}</style>
</head>
<body>
<header>
  <div class="shell header-inner">
    <div><h1>이민유 부산교대 가자</h1><p>2027학년도 예상문제를 골라 2분 내외로 답해 보세요.</p></div>
    <div class="total" id="total"></div>
  </div>
</header>
<main class="shell">
  <div class="app-actions">
    <button class="button" id="html-save" type="button">프로그램 HTML 다운로드</button>
    <button class="button primary" id="pdf-open" type="button">전체 문제·답변 PDF</button>
    <details class="file-tools">
      <summary>기존 HTML 선택</summary>
      <label for="source-file">면접 연습 HTML 파일</label>
      <input id="source-file" type="file" accept=".html,.htm,text/html">
      <button class="button" id="restore-default" type="button" hidden>2027 예상문제 50문항으로 돌아가기</button>
      <p id="import-status" role="status"></p>
    </details>
  </div>
  <div class="toolbar">
    <div class="filters" role="group" aria-label="문제 영역">
      <button type="button" class="chip" data-filter="전체" aria-pressed="true">전체</button>
      <button type="button" class="chip" data-filter="디지털·문해교육" aria-pressed="false">디지털·문해교육</button>
      <button type="button" class="chip" data-filter="수업·학습 지원" aria-pressed="false">수업·학습 지원</button>
      <button type="button" class="chip" data-filter="생활지도·학생 지원" aria-pressed="false">생활지도·학생 지원</button>
      <button type="button" class="chip" data-filter="학교·지역사회" aria-pressed="false">학교·지역사회</button>
      <button type="button" class="chip" data-filter="교직관·예비교사 성장" aria-pressed="false">교직관·예비교사 성장</button>
      <button type="button" class="chip" data-filter="학교폭력" aria-pressed="false">학교폭력</button>
      <button type="button" class="chip" data-filter="질문·학습자 주도성" aria-pressed="false">질문·학습자 주도성</button>
    </div>
    <button type="button" class="button" id="shuffle">무작위 문제</button>
  </div>
  <div class="layout">
    <aside class="panel" aria-labelledby="list-title">
      <h2 id="list-title">문제 목록</h2>
      <ul id="question-list"></ul>
    </aside>
    <div class="workspace">
      <section class="prompt panel" aria-labelledby="question">
        <div class="question-heading">
          <button class="button mobile-picker" id="picker-open" type="button"
                  aria-haspopup="dialog" aria-controls="picker-dialog">문제 선택</button>
          <div class="question-text">
            <p class="eyebrow" id="topic"></p>
            <h2 id="question" tabindex="-1" aria-live="polite"></h2>
          </div>
        </div>
        <div class="timer-box" id="timer-box">
          <div class="timer-top"><span>남은 시간</span><span class="time" id="clock" role="timer" aria-live="off">02:00</span></div>
          <div class="timer-controls">
            <button type="button" class="button primary" id="start">시작</button>
            <button type="button" class="button" id="reset" disabled>초기화</button>
          </div>
          <progress class="meter" id="meter" max="120" value="120" aria-label="남은 시간"></progress>
          <p class="timer-message" id="timer-message" role="status">준비되면 시작을 누르세요.</p>
        </div>
        <nav class="nav" aria-label="문제 이동">
          <button type="button" class="button" id="prev">이전 문제</button>
          <button type="button" class="button" id="next">다음 문제</button>
        </nav>
      </section>
      <section class="answer panel" aria-labelledby="answer-title">
        <div class="answer-head">
          <h2 id="answer-title">2분 모범 답변</h2>
          <button type="button" class="button" id="toggle" aria-controls="answer-body" aria-expanded="false">모범 답변 보기</button>
        </div>
        <div id="answer-body" hidden>
          <p class="reference" id="practice-note" hidden></p><div class="script" id="script"></div>
          <button type="button" class="button" id="copy">답변 복사</button>
          <p class="copy-status" id="copy-status" role="status"></p>
          <p class="reference" id="reference" hidden><a id="reference-link" target="_blank" rel="noopener noreferrer"></a></p>
        </div>
      </section>
    </div>
  </div>
  <dialog id="picker-dialog" aria-labelledby="picker-title">
    <div class="picker-header">
      <h2 id="picker-title">문제 선택</h2>
      <button class="button" id="picker-close" type="button">닫기</button>
    </div>
    <select class="picker" id="picker" aria-labelledby="picker-title"></select>
    <button class="button primary" id="picker-confirm" type="button">선택한 문제 보기</button>
  </dialog>
  <dialog id="pdf-dialog" aria-labelledby="pdf-title">
    <div class="pdf-top">
      <h2 id="pdf-title">전체 문제·모범 답변 PDF</h2>
      <button class="button" id="pdf-close" type="button">닫기</button>
    </div>
    <div class="pdf-controls">
      <button class="button" id="pdf-back" type="button">이전 쪽</button>
      <span id="pdf-count" aria-live="polite"></span>
      <button class="button" id="pdf-next" type="button">다음 쪽</button>
      <select class="picker" id="pdf-jump" aria-label="PDF 주제로 이동"></select>
      <button class="button primary" id="pdf-save" type="button">PDF 다운로드</button>
    </div>
    <p id="pdf-status" role="status"></p>
    <p id="pdf-text" class="screen-reader"></p>
    <div class="pdf-sheet">
      <canvas id="pdf-paper" width="1190" height="1684" aria-label="현재 PDF 페이지"></canvas>
    </div>
  </dialog>
  <p class="footer">『이만두 교대 면접 준비서』의 2027학년도 예상문제와 답변 구조를 참고해 구성했습니다. 실제 말하기 시간은 속도에 따라 달라질 수 있습니다.</p>
</main>
<noscript><p class="shell">문제와 타이머를 사용하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
<script>
'use strict';
const defaultTopics = [{"title":"AI·디지털 미래교육","category":"디지털·문해교육","variants":[{"title":"AI가 작성한 과제","prompt":"생성형 AI가 만든 답을 초등학생이 그대로 과제에 제출했을 때 교사는 어떻게 지도해야 하는가?","answer":["학생이 무엇을 이해했는지 확인하고, 자기 말로 다시 써 볼 기회를 주겠습니다.","첫째, 학생과 따로 만나 AI에 어떤 질문을 했고 어떤 부분을 그대로 옮겼는지 듣겠습니다. 글의 요지를 설명해 보게 하면 사용 규칙이 헷갈렸는지, 내용 자체가 어려웠는지 알 수 있습니다.","둘째, 글 속 주장 한 가지를 골라 교과서나 원자료로 확인하게 하겠습니다. 학생이 확인한 사실과 자신의 예를 넣어 문단을 다시 쓰고, AI 도움을 받은 부분을 표시하도록 지도하겠습니다.","셋째, 다음 과제부터는 AI 활용이 가능한 단계와 표시 방법을 예시와 함께 안내하겠습니다. 초안과 수정 이유를 함께 살펴 학생이 실제로 어떤 생각을 발전시켰는지 피드백하겠습니다.","학생이 최종 결과를 설명하고 그 내용에 책임질 수 있는 과제 문화를 만들겠습니다."]},{"title":"AI 추천과 교사 관찰","prompt":"AI가 추천한 수준별 학습과 교사의 관찰 결과가 다를 때 무엇을 우선해야 하는가?","answer":["AI의 추천과 교사의 관찰이 다를 때는 학생의 수행을 추가로 확인한 뒤 교사가 지원을 결정하겠습니다.","첫째, 추천의 근거부터 보겠습니다. 높은 정답률이 개념 이해를 뜻하는지, 비슷한 문제를 반복해서 익숙해졌는지 학습 기록을 살펴보겠습니다. 교실에서 어려워한 장면도 구체적으로 확인하겠습니다.","둘째, 예를 들어 분수 비교 문제를 새로 주고 답과 이유를 그림이나 말로 설명하게 하겠습니다. 학생에게도 어떤 부분이 어려웠는지 물어 숫자로 드러나지 않은 맥락을 알아보겠습니다.","셋째, 결과에 따라 개념을 다시 지도하거나 심화 과제를 제공하겠습니다. 며칠 뒤 다른 문제에서 혼자 적용하는지 확인하고 판단의 근거와 변화도 기록하겠습니다.","AI의 자료를 활용하되 학생에게 어떤 지원을 제공할지 설명하고 책임지는 일은 교사가 맡겠습니다."]},{"title":"AI 수업 확대의 우려","prompt":"초등학교에서 AI 활용 수업을 확대할 때 가장 우려되는 문제와 해결 방안을 말하시오.","answer":["AI 수업을 확대할 때 학생이 생각하는 과정이 줄고, 활용 여건의 차이가 학습 격차로 이어지는 점을 가장 우려합니다.","첫째, AI를 열기 전에 각자 문제의 답이나 해결 방법을 기록하게 하겠습니다. AI 응답과 자신의 생각을 비교하고, 무엇을 받아들였는지 근거를 설명하도록 하겠습니다.","둘째, 학교에서 기기와 접근 기회를 마련하고, 필요한 학생에게는 사용 예시와 짝 활동을 제공하겠습니다. 종이 자료나 교사 안내를 활용해도 같은 목표를 달성할 수 있도록 과제를 설계하겠습니다.","셋째, 학생에게 이름과 사진 등 개인정보 입력을 피하고 AI 답을 교과서나 원자료로 검증하는 습관을 가르치겠습니다. 교사는 결과물뿐 아니라 초안과 수정 과정을 살피겠습니다.","AI 활용의 성과는 사용 횟수보다 학생의 사고와 참여가 실제로 깊어졌는지로 판단하겠습니다."]},{"title":"학급 단체방 딥페이크 대응","prompt":"학생의 얼굴을 이용한 딥페이크 영상이 학급 단체방에 공유된 경우 담임교사의 대응을 말하시오.","answer":["학생의 안전과 추가 확산 방지를 우선하고, 학교 절차와 전문 지원을 연결하겠습니다.","첫째, 학생이 안전한 곳에서 말할 수 있게 하고, 위협이나 추가 유포가 이어지는지 확인하겠습니다. 학급에는 재전송과 저장을 멈추도록 안내하고 피해학생의 신원이나 내용을 공개하지 않겠습니다.","둘째, 학교장과 담당자에게 즉시 알리고, 보호자 안내와 보호 조치가 이루어지도록 협력하겠습니다. 게시 시각과 위치 등 사실을 기록하고, 학생에게 영상을 다시 보내게 하는 대신 담당자와 자료 보존 및 삭제 지원을 협의하겠습니다.","셋째, 사안 처리 중과 이후에도 보복이나 조롱이 이어지는지 살피고 상담과 학습 지원을 연결하겠습니다. 이후 학급에서는 실제 사건을 드러내지 않고 합성물과 유포에 대한 책임을 지도하겠습니다.","피해학생이 안심하고 학교생활을 이어갈 수 있는지까지 확인하는 것이 담임의 역할이라고 생각합니다."],"tags":["학교폭력"]},{"title":"디지털 기기의 선택적 활용","prompt":"디지털 기기 사용을 제한하는 수업과 적극 활용하는 수업 중 어느 쪽이 바람직한가?","answer":["저는 학습 목표와 학생 발달에 맞춰 디지털 기기를 필요한 순간에 사용하는 수업이 바람직하다고 생각합니다.","첫째, 먼저 학생이 무엇을 경험해야 하는지 정하겠습니다. 식물 관찰에서는 실물을 보고 이야기하는 시간을 확보하고, 여러 날의 변화를 한눈에 비교할 때 사진과 화면을 활용하겠습니다.","둘째, 기기를 쓸 때는 목적과 사용 시간을 미리 알려 주겠습니다. 친구 의견을 들을 때는 화면을 내려놓게 하고, 사용이 어려운 학생에게는 짝 활동이나 종이 자료를 제공하겠습니다.","셋째, 활동이 끝나면 학생이 기기 없이도 발견한 사실과 근거를 설명할 수 있는지 확인하겠습니다. 조작에 시간이 너무 많이 들었거나 참여가 줄었다면 다음 활동에서 도구를 바꾸겠습니다.","학생이 필요에 따라 도구를 선택하고 스스로 사용할 때와 내려놓을 때를 구분하도록 돕겠습니다."]}]},{"title":"기초학력·맞춤교육","category":"수업·학습 지원","variants":[{"title":"기초학력 별도 지도와 공정성","prompt":"기초학력이 부족한 학생에게 별도 지도를 제공하는 것이 공정한지 말하시오.","answer":["학생이 배움에 참여하는 데 필요한 도움을 제공한다는 점에서 기초학력 별도 지도는 공정하다고 생각합니다.","첫째, 같은 읽기 과제를 받아도 낱말을 읽는 데 힘을 쓰는 학생은 내용을 이해할 시간이 부족할 수 있습니다. 짧은 읽기 활동으로 어디에서 막히는지 확인해 꼭 필요한 부분을 지원하겠습니다.","둘째, 수업 중에는 자료와 도움을 여러 방식으로 제공하고, 추가 지도가 필요하면 학생과 보호자에게 목적을 개별적으로 설명하겠습니다. 학생의 이름이나 결과가 불필요하게 드러나지 않게 운영하겠습니다.","셋째, 지원이 끝난 뒤에는 이전에 도움을 받던 과제를 혼자 해결하는지 살피겠습니다. 결과에 따라 도움을 줄이거나 바꾸고, 학생에게 어떤 방법이 효과를 냈는지 알려 주겠습니다.","공정성을 판단할 때는 누구에게 도움을 더 주었는가보다 모두에게 배울 기회가 있었는가를 보겠습니다."]},{"title":"1교실 2교사 협력수업","prompt":"1교실 2교사 또는 협력강사제를 효과적으로 운영하기 위한 조건을 말하시오.","answer":["협력수업이 효과를 내려면 두 교육자가 목표와 학생에 대한 판단을 공유하고 각자의 역할을 명확히 해야 합니다.","첫째, 수업 전에 함께 성취기준과 학생의 어려움을 확인하겠습니다. 설명, 실습 지원, 관찰을 누가 맡을지 정하고, 지원이 필요한 장면과 확인할 항목을 미리 합의하겠습니다.","둘째, 활동에 맞춰 두 모둠에 같은 내용을 나누어 지도하거나 소집단에 보충 설명을 제공하겠습니다. 지원은 학생의 반응에 따라 유연하게 바꾸고, 특정 학생만 계속 분리하지 않겠습니다.","셋째, 수업을 마치면 답변이나 관찰 기록을 함께 보겠습니다. 예를 들어 문장을 읽고도 내용을 설명하기 어려웠다면 다음 수업에서 읽기보다 구조를 파악하는 활동을 보완하겠습니다.","두 사람이 교실에 있는 시간만큼, 함께 계획하고 수업을 고치는 시간이 중요하다고 생각합니다."]},{"title":"학습 저해 요인이 의심되는 학생","prompt":"난독·경계선 지능 등 학습 저해 요인이 의심되는 학생을 어떻게 지원할 것인가?","answer":["교실에서 확인한 구체적인 어려움을 바탕으로 당장 필요한 지원을 제공하고, 필요한 경우 전문 평가에 연결하겠습니다.","첫째, 학생이 어떤 낱말을 읽을 때 오류를 내는지, 글을 들려주면 뜻을 이해하는지 나누어 관찰하겠습니다. 잘하는 활동도 함께 기록해 보호자와 대화할 때 강점과 어려움을 함께 설명하겠습니다.","둘째, 글을 짧게 나누거나 듣기 자료를 제공해 교과 활동에 참여할 수 있게 돕겠습니다. 별도로 어려움을 보이는 읽기 기능을 짧게 연습하고 학생의 반응을 기록하겠습니다.","셋째, 어려움이 이어지면 학교 기초학력 담당자와 협의하여 보호자에게 전문 평가와 지원을 안내하겠습니다. 학습 방법을 바꾼 뒤에는 학생이 혼자 할 수 있는 일이 늘었는지 확인하겠습니다.","이른 발견의 목적은 학생에게 진단명을 붙이는 데 있지 않습니다. 배움에 필요한 도움을 놓치지 않겠습니다."]},{"title":"성취 결과 공개와 학습 동기","prompt":"학생의 성취 결과를 공개해 학습 동기를 높이자는 의견에 대한 생각을 말하시오.","answer":["학급에서 개인의 성취 결과를 공개하는 방식에는 반대합니다. 이전보다 성장한 점을 스스로 확인할 수 있게 하겠습니다.","첫째, 점수를 공개하면 일부 학생에게는 자극이 되지만, 어려움을 겪는 학생은 실수를 피하려고 도전을 줄일 수 있습니다. 개인 평가 결과는 학생과 보호자에게 개별적으로 전달하겠습니다.","둘째, 학생과 이전 결과를 비교하며 구체적인 피드백을 나누겠습니다. 예를 들어 틀린 개수만 말하기보다 이번에는 근거를 두 가지 제시했고 다음에는 출처를 적으면 된다고 알려 주겠습니다.","셋째, 학급에는 개인을 알 수 없는 공동 목표와 진전 상황을 공유하겠습니다. 학생들이 자신의 다음 목표를 정하고 작은 변화도 기록하게 하겠습니다.","학생이 다른 사람의 점수보다 자신의 다음 행동에 관심을 두도록 평가를 운영하겠습니다."]},{"title":"보호자의 선행학습 요청","prompt":"학부모가 자녀에게 더 어려운 선행학습 과제를 제공해 달라고 요청할 때 어떻게 대응할 것인가?","answer":["보호자의 기대를 존중하며, 학생이 현재 교육과정 안에서 충분히 도전할 수 있는 심화 과제를 마련하겠습니다.","첫째, 보호자가 어떤 장면을 보고 요청했는지 듣고, 학생이 실제로 어떤 과제에서 지루함이나 흥미를 느끼는지 확인하겠습니다. 빠르게 끝내는 것과 낯선 문제에서 개념을 적용하는 것을 함께 보겠습니다.","둘째, 같은 학습 목표 안에서 사고의 깊이를 높이겠습니다. 예를 들어 한 문제를 두 가지 방법으로 풀고 언제 각각이 편리한지 설명하게 하거나, 배운 개념으로 친구가 풀 문제를 직접 만들게 하겠습니다.","셋째, 보호자에게 과제의 예와 학생의 반응을 공유하고, 이후 어떤 도전이 더 필요한지 학생과 상의하겠습니다. 학생이 어려운 과제에서 질문하고 다시 시도하는 과정도 살피겠습니다.","학생이 스스로 깊게 생각하고 도전을 즐기는 경험을 쌓게 하겠습니다."]}]},{"title":"마음건강·사회정서교육","category":"생활지도·학생 지원","variants":[{"title":"수업 중 화와 친구 갈등","prompt":"수업 중 자주 화를 내고 친구와 충돌하는 학생을 어떻게 지도할 것인가?","answer":["학생과 주변의 안전을 확보한 뒤, 화를 알아차리고 안전하게 표현하는 방법을 가르치겠습니다.","첫째, 충돌이 시작되면 위험한 행동을 멈추게 하고 학생들을 떨어뜨려 다친 곳이 없는지 확인하겠습니다. 학생이 감정을 가라앉힐 동안 교직원이 곁에서 살피고 학급의 학습도 이어지게 하겠습니다.","둘째, 안정된 뒤 어떤 일이 있었고 몸과 마음이 어떻게 달라졌는지 함께 짚겠습니다. 다음에 화가 나면 말로 잠깐 쉬고 싶다고 알리거나 교사에게 도움 신호를 보내는 방법을 연습하겠습니다.","셋째, 비슷한 상황에서 학생이 새 방법을 시도하면 구체적으로 알려 주겠습니다. 충돌이 반복되면 상황과 도움이 된 방법을 기록하고, 보호자와 상담교사에게 공유해 함께 지원하겠습니다.","감정은 충분히 들으면서도 다른 사람을 다치게 하지 않는 표현을 학생이 실제로 익히도록 돕겠습니다."]},{"title":"학급에서 실천하는 사회정서교육","prompt":"2026년 확대되는 사회정서교육을 학급에서 어떻게 실천할 것인가?","answer":["사회정서교육을 아침 활동과 교과 수업, 생활지도에 자연스럽게 연결하겠습니다.","첫째, 아침에는 감정 그림이나 낱말을 활용해 자기 마음을 살피게 하겠습니다. 말하기 부담스러운 학생은 쪽지로 교사에게만 알려도 되고, 도움이 필요할 때 누구에게 말할 수 있는지 안내하겠습니다.","둘째, 수업에서는 함께 과제를 한 뒤 어떤 말이 협력에 도움이 됐는지 돌아보겠습니다. 국어 시간에는 이야기에 나오는 갈등을 읽고 각 인물이 느낀 감정과 취할 수 있는 행동을 여러 가지로 생각하게 하겠습니다.","셋째, 갈등이 생기면 진정한 뒤 사실과 감정을 차례로 말하고 상대의 입장을 확인하도록 돕겠습니다. 실제로 어떤 방법을 써 보았는지 학생과 점검하되 개인의 감정이나 사생활은 공개하지 않겠습니다.","학생이 교실에서 마음을 표현하고 안전하게 도움을 요청하는 경험을 꾸준히 쌓게 하겠습니다."]},{"title":"학생의 자살 위험 신호에 대응","prompt":"친구가 “살고 싶지 않다”고 말했다는 이야기를 들은 학생이 상담을 요청할 때 교사의 대응을 말하시오.","answer":["제보를 진지하게 받아들이고 학생의 안전을 곧바로 확인하겠습니다. 학교의 위기 대응 절차에 따라 혼자 판단하지 않고 도움을 연결하겠습니다.","첫째, 제보한 학생에게 알려 줘서 고맙다고 말하고, 들은 말과 시각, 해당 학생이 어디에 있는지 필요한 사실을 확인하겠습니다. 안전을 위해 도움을 줄 어른과 필요한 정보를 나누겠다고 설명하겠습니다.","둘째, 해당 학생에게 교직원이 바로 가서 차분히 말을 듣고, 위험이 해소될 때까지 혼자 두지 않겠습니다. 관리자와 상담 담당자에게 즉시 알리고 보호자에게 연락하겠습니다. 생명이 위급하거나 위험이 임박하면 즉시 119에 도움을 요청하겠습니다.","셋째, 전문가에게 안전하게 인계하고 상담과 치료, 학교 복귀 지원이 이어지는지 살피겠습니다. 제보한 학생에게도 책임을 떠안을 필요가 없다고 알려 주고 사안이 퍼지지 않도록 돕겠습니다.","가장 중요한 일은 위험 신호를 알아차린 순간부터 안전한 인계까지 보호가 끊기지 않게 하는 것입니다."]},{"title":"실패가 두려운 학생의 도전","prompt":"실패를 두려워해 쉬운 과제만 선택하는 학생에게 어떤 경험을 제공할 것인가?","answer":["학생이 해볼 만한 도전을 고르고, 피드백을 받아 다시 시도하는 경험을 마련하겠습니다.","첫째, 먼저 학생에게 어떤 부분이 부담스러운지 묻겠습니다. 발표 자체가 어려운지, 틀렸을 때 친구가 어떻게 볼지 걱정되는지에 따라 필요한 도움은 달라집니다.","둘째, 큰 과제를 작게 나누고 학생과 다음 단계를 정하겠습니다. 예를 들어 모둠 발표가 부담스럽다면 자신이 찾은 자료 한 장을 짝에게 설명한 다음, 준비가 되었을 때 모둠에서 말하도록 하겠습니다.","셋째, 결과뿐 아니라 바꿔 본 전략을 구체적으로 알려 주겠습니다. 학생이 처음 말하기와 다시 한 설명을 비교해 효과가 있었던 방법을 적어 보고, 다음 목표의 크기도 직접 조정하게 하겠습니다.","학생이 선택한 도전이 작더라도 다시 시도해 변화가 생겼다는 사실을 스스로 확인하도록 돕겠습니다."]},{"title":"마음건강 설문 결과 활용","prompt":"학생의 마음건강 설문 결과를 교사가 수업과 생활지도에 활용할 때 주의할 점을 말하시오.","answer":["설문은 도움이 필요한 학생을 살피는 자료로 쓰겠습니다. 해석과 지원은 면담, 관찰, 담당자의 전문적 판단을 함께 바탕으로 하겠습니다.","첫째, 학생과 보호자에게 설문의 목적, 결과를 볼 수 있는 사람, 도움받는 방법을 알리겠습니다. 결과는 필요한 담당자만 확인하도록 하고 학급 활동에서 개인의 응답을 드러내지 않겠습니다.","둘째, 응답에 우려가 보이면 교사가 학생과 조용히 만나 어떤 상황인지 살피겠습니다. 평소 모습과 학생의 설명을 함께 확인하고 위험 신호가 있다면 학교 절차에 따라 상담과 전문 지원을 빠르게 연결하겠습니다.","셋째, 학급 전체에 공통으로 필요한 지원은 개인을 식별할 수 없는 방식으로 수업에 반영하겠습니다. 개별 지원을 연결한 뒤에는 학생이 실제로 도움을 받는지 담당자와 점검하겠습니다.","설문의 가치는 응답에 이름을 붙이는 데 있지 않습니다. 학생이 제때 안전하게 도움을 받을 수 있게 하겠습니다."]}]},{"title":"생활지도·교육활동 보호","category":"생활지도·학생 지원","variants":[{"title":"수업 방해와 학생인권","prompt":"학생의 수업 방해 행동과 학생인권을 함께 고려한 지도 방안을 말하시오.","answer":["해당 학생의 존엄과 학급 전체의 학습권을 함께 지키도록, 필요한 만큼 개입하고 다시 참여할 방법을 열겠습니다.","첫째, 수업 전에 발언과 이동 규칙을 구체적으로 안내하겠습니다. 방해가 시작되면 가까이 다가가거나 약속한 신호를 보내고, 지금 해야 할 행동을 짧게 말하겠습니다.","둘째, 수업 뒤에는 학생과 따로 만나 어떤 순간에 어려웠는지 듣겠습니다. 과제 시작이 어렵다면 첫 문제를 같이 보고, 도움을 요청할 신호를 정해 다음 수업에서 연습하겠습니다.","셋째, 행동이 반복되면 학교 규정과 절차에 따라 관찰 내용과 시도한 지도를 기록하겠습니다. 보호자와 학교의 담당자에게 필요한 내용을 공유하고 학급의 학습 상황도 함께 확인하겠습니다.","좋은 생활지도는 학생이 수업에 돌아올 길을 알려 주고, 다른 학생들도 안정적으로 배우게 하는 지도입니다."]},{"title":"생활지도 녹음의 온라인 공개","prompt":"학부모가 교사의 생활지도 내용을 녹음해 온라인에 공개한 경우 어떻게 대응할 것인가?","answer":["학생 정보 보호와 사실 확인을 우선하고, 학교의 공식 창구를 통해 대응하겠습니다.","첫째, 게시물을 확인한 시각과 공개 범위, 당시 지도 내용과 경위를 기록해 관리자에게 알리겠습니다. 학생의 신원이나 사적인 이야기가 드러난다면 학교와 함께 추가 노출을 줄일 방법을 확인하겠습니다.","둘째, 보호자가 무엇을 걱정하는지 공식 면담에서 듣고, 당시 상황과 지도 목적, 적용한 규칙을 자료와 함께 설명하겠습니다. 지도 과정에 보완할 점이 확인되면 학교와 상의해 바로잡겠습니다.","셋째, 온라인에 댓글을 달거나 문제 자료를 여러 사람에게 전달하지 않겠습니다. 필요한 경우 학교를 통해 교육활동 보호 담당자와 상담하고, 수업이나 학생 관계에 미친 영향도 살피겠습니다.","사안의 사실과 학생 보호에 집중하면서, 학교의 절차 안에서 설명할 책임을 다하겠습니다."]},{"title":"학생 참여형 학급규칙","prompt":"교사의 정당한 생활지도와 학생 참여를 조화시키는 학급규칙 제정 방법을 말하시오.","answer":["교사가 안전과 권리의 기준을 설명하고, 그 안에서 학생들이 지킬 방법을 함께 정하겠습니다.","첫째, 교실에서 겪는 실제 어려움부터 모으겠습니다. 예를 들어 계단에서 뛰는 상황을 두고 어떤 위험이 생기는지 함께 살피고, 학교 안전 기준에 따라 꼭 지켜야 할 사항을 설명하겠습니다.","둘째, 이동 신호나 줄을 서는 방식처럼 조정할 수 있는 부분은 학생이 제안하게 하겠습니다. 여러 의견을 안전성, 공정성, 실천 가능성으로 비교하고 소수 의견도 함께 듣겠습니다.","셋째, 정한 규칙을 일정 기간 적용하고 지키기 어려웠던 이유와 필요한 지원을 확인하겠습니다. 실수했을 때는 규칙의 이유를 다시 살피고 피해를 회복할 행동을 함께 정하겠습니다.","학생이 왜 필요한 규칙인지 자기 말로 설명하고 고치는 데 참여할 때 학급규칙이 생활 속 약속으로 자리 잡습니다."]},{"title":"수업 중 스마트폰 제한","prompt":"수업 중 스마트폰 사용을 전면 금지하는 방안에 대한 의견을 말하시오.","answer":["수업 중에는 스마트폰 사용을 원칙적으로 제한하되, 법과 학교 규칙이 정한 필요한 예외도 보장하겠습니다.","첫째, 수업 전에 언제 기기를 보관하고 언제 사용할 수 있는지 안내하겠습니다. 알림과 화면으로 집중이 흐트러질 수 있다는 점을 학생들과 구체적인 수업 장면을 통해 살피겠습니다.","둘째, 보조기기 사용, 교육 목적의 활동, 긴급한 상황에 대해서는 법과 학교 규칙에 따른 예외를 안내하겠습니다. 교육용으로 열 때도 목적과 시간을 분명히 하고 활동 뒤에는 화면을 내려놓게 하겠습니다.","셋째, 일상적인 규칙과 도움이 필요한 경우를 보호자에게도 공유하겠습니다. 제한의 효과는 수업 참여가 나아졌는지, 필요한 학생의 접근이 막히지 않았는지 함께 확인하겠습니다.","학생이 집중할 권리를 지키면서 필요한 기술을 목적에 맞게 사용하는 습관을 기르겠습니다."]},{"title":"학교폭력 이후 관계 회복","prompt":"학교폭력 사안에서 관계 회복 프로그램을 운영할 때 주의할 점을 말하시오.","answer":["학교폭력 이후 관계 회복은 피해학생의 안전과 자발적인 참여가 전제되어야 한다고 생각합니다.","첫째, 학교의 공식 사안 처리와 보호 조치를 먼저 확인하겠습니다. 피해학생에게 선택할 수 있는 지원을 설명하고, 참여를 원하지 않거나 중간에 그만두어도 그 의사를 존중하겠습니다.","둘째, 참여 의사가 확인되면 전문 진행자와 당사자별 사전 면담을 준비하겠습니다. 직접 대면 없이 의견을 전하는 방법도 고려하고, 해를 끼친 행동에 대한 책임과 구체적인 재발 방지 약속을 다루겠습니다.","셋째, 프로그램 뒤에는 약속이 실제로 지켜지는지와 추가 피해가 있는지 확인하겠습니다. 피해학생에게 필요한 상담과 학습 지원을 이어가고, 불안이 계속되면 학교 담당자와 보호 방법을 다시 협의하겠습니다.","관계 회복의 성과는 화해 여부보다 피해학생이 일상에서 안전을 되찾았는지로 확인하겠습니다."],"tags":["학교폭력"]}]},{"title":"포용·다문화·특수교육","category":"생활지도·학생 지원","variants":[{"title":"이주배경학생의 모둠 참여","prompt":"한국어가 서툰 이주배경학생이 모둠활동에서 소외될 때 어떻게 지원할 것인가?","answer":["학생이 편한 방식으로 의견을 표현하고 모둠의 결과에 기여하도록 돕겠습니다.","첫째, 과제 설명의 낱말이 어려운지, 의견은 있지만 말할 시간이 부족한지 관찰하고 학생과 짧게 이야기하겠습니다. 어떤 역할을 해 보고 싶은지와 편한 표현 방법도 함께 확인하겠습니다.","둘째, 그림과 사진, 간단한 시범으로 핵심 낱말을 설명하겠습니다. 학생이 사진을 골라 이유를 말하거나 그림과 핵심어로 의견을 나타내게 하겠습니다. 모둠원에게는 답을 대신하기 전에 기다리고 뜻을 확인하는 방법을 가르치겠습니다.","셋째, 활동 뒤에는 학생의 의견이 결과물에 어떻게 반영됐는지 확인하고 다음에 어떤 지원이 필요한지 묻겠습니다. 자주 쓰는 학습 표현을 수업에서 반복하며, 필요하면 학교 담당자와 보호자에게 지원을 요청하겠습니다.","모둠에 속해 있는 것에서 나아가 자신이 낸 의견이 공동의 배움에 실제로 쓰이는 경험을 마련하겠습니다."]},{"title":"통합학급의 학습 참여","prompt":"통합학급에서 특수교육대상학생 때문에 수업이 늦어진다는 불만이 나올 때 어떻게 지도할 것인가?","answer":["학생마다 필요한 도움을 제공하고, 특수교사와 함께 학급 전체가 참여할 수 있는 수업을 설계하겠습니다.","첫째, 학생을 탓하는 표현을 멈추게 하고 친구들이 실제로 무엇을 어려워했는지 듣겠습니다. 기다리는 시간이 길었는지, 언제 무엇을 해야 할지 불분명했는지 살펴보겠습니다. 개인의 장애나 지원 정보는 공개하지 않겠습니다.","둘째, 특수교사와 학생의 목표와 필요한 조정을 확인하겠습니다. 활동 순서를 그림과 짧은 말로 함께 안내하고 글, 말, 그림으로 표현할 수 있게 하겠습니다. 먼저 마친 학생에게는 같은 목표를 깊이 탐구할 과제를 주겠습니다.","셋째, 수업 뒤에는 어떤 도움으로 학생들이 참여했는지 학생의 의견과 결과를 함께 살피겠습니다. 다음 시간에 자료와 활동 시간을 조정하고 특수교사와 실제 변화를 확인하겠습니다.","모두가 각자의 속도로 배우면서 함께 과제에 참여할 수 있는 수업 구조를 만들겠습니다."]},{"title":"음식·의상 중심 다문화교육의 한계","prompt":"다문화교육을 음식·의상 체험 중심으로 운영하는 것의 한계와 개선 방안을 말하시오.","answer":["음식과 의상은 관심을 여는 소재로 활용하고, 여러 문화 속 사람들의 실제 삶과 다양한 관점을 함께 다루겠습니다.","첫째, 같은 나라 안에도 지역과 세대, 가족에 따라 생활 방식이 다르다는 점을 살피겠습니다. 학생 한 명에게 출신 국가를 대표해 설명하라고 요구하지 않고 책이나 인터뷰 자료에서 여러 목소리를 만나게 하겠습니다.","둘째, 가족과 언어, 이주, 친구 관계 같은 주제로 공통점과 차이를 묻게 하겠습니다. 이야기 속 인물을 한 문화의 특징으로 단정하는 말이 나오면 자료에서 실제로 확인한 사실인지 함께 따져 보겠습니다.","셋째, 학생이 자신의 경험을 나누고 싶을 때 원하는 방식으로 표현할 기회를 주겠습니다. 교실과 지역에서 배제하는 말이나 행동을 발견하면 어떻게 바꿀 수 있을지 작은 실천을 함께 정하겠습니다.","다문화교육을 통해 학생이 다양한 생활 방식을 존중하고 일상에서 동등하게 대하는 태도를 기르도록 돕겠습니다."]},{"title":"공통 과제와 선택 과제의 공정성","prompt":"모든 학생에게 같은 과제를 주는 것과 선택 과제를 주는 것 중 어느 쪽이 공정한가?","answer":["공통 학습 목표와 평가 기준을 분명히 두고 학생에게 자료나 표현 방법을 선택하게 하는 편이 공정하다고 생각합니다.","첫째, 먼저 모든 학생이 무엇을 이해하고 설명해야 하는지 안내하겠습니다. 예를 들어 물의 순환을 배우면, 증발과 응결이 일어나는 과정을 근거와 함께 설명하는 것을 공통 목표로 삼겠습니다.","둘째, 글, 그림과 말, 모형 가운데 방법을 고를 수 있게 하겠습니다. 선택한 방법에 관계없이 물의 변화와 그 이유가 드러나게 안내하고, 필요한 학생에게는 핵심어 카드나 예시를 제공하겠습니다.","셋째, 평가는 그림의 솜씨보다 설명의 정확성과 근거를 보겠습니다. 표현만으로 이해가 충분히 드러나지 않으면 짧은 질문으로 설명할 기회를 주고, 피드백 뒤에 보완하게 하겠습니다.","모든 학생이 같은 핵심 내용에 도전하도록 기대를 유지하면서, 그 목표에 도달할 길을 열어 주겠습니다."]},{"title":"소규모 학교의 교육적 가능성","prompt":"학령인구 감소 시대에 소규모 학교가 지닌 교육적 가능성을 말하시오.","answer":["소규모 학교는 학생을 세심하게 살피고 지역과 긴밀히 연결하는 수업을 운영할 수 있다고 생각합니다.","첫째, 학생 수가 적다는 점을 활용해 각자의 관심과 학습 수준을 자세히 살피겠습니다. 과제를 시작하거나 질문하기 어려운 순간을 알면 학생에게 필요한 자료와 피드백을 제때 제공할 수 있습니다.","둘째, 학년을 넘는 공동 프로젝트를 운영하겠습니다. 예를 들어 마을 하천을 조사할 때 저학년은 생물을 그림으로 기록하고 고학년은 조사 결과를 표로 정리하며, 주민이나 전문가에게 질문해 결과를 보완하겠습니다.","셋째, 또래 관계와 교과 경험의 폭이 좁아지지 않도록 인근 학교와 문화·체육 활동이나 온라인 공동수업을 운영하겠습니다. 친구를 새로 만나고 다른 생각을 비교할 기회를 정기적으로 마련하겠습니다.","학교 규모에서 오는 장점을 살리고 지역과 다른 학교의 자원을 연결해 학생의 배움 범위를 넓히겠습니다."]}]},{"title":"교육과정·수업·평가","category":"수업·학습 지원","variants":[{"title":"2022 개정 교육과정의 우선 과제","prompt":"2026년부터 초등학교 전 학년에 적용되는 2022 개정 교육과정에서 초등교사가 가장 중시해야 할 점을 말하시오.","answer":["학생이 배움의 목표를 이해하고 스스로 선택과 성찰을 경험하는 학생 주도성을 중시하겠습니다.","첫째, 먼저 성취기준을 학생이 이해할 말로 풀고, 어떤 활동을 하면 목표에 도달했는지 보여 주겠습니다. 사회 시간에 지역 문제를 다룬다면 문제의 원인을 설명하고 자료를 들어 실천안을 제안하도록 안내하겠습니다.","둘째, 조사 대상이나 자료, 발표 방식을 학생이 일부 선택하도록 하겠습니다. 시작이 어려운 학생에게는 두 가지 예시나 질문 틀을 주고, 스스로 계획을 세울 수 있게 도움을 점차 줄이겠습니다.","셋째, 활동 중간에 선택한 방법이 목표에 맞는지 점검하겠습니다. 마지막에는 처음의 질문과 결과를 비교하며 무엇이 바뀌었는지, 다음에는 어떤 방법을 써 볼지 기록하게 하겠습니다.","학생이 자신의 선택을 설명하고 그 결과를 고칠 수 있도록 교사가 목표와 지원을 세심하게 설계하겠습니다."],"tags":["질문·학습자 주도성"]},{"title":"과정중심평가와 교사 업무","prompt":"과정중심평가가 교사의 업무 부담을 높인다는 의견에 대한 생각을 말하시오.","answer":["과정중심평가를 유지하되 수업 속 핵심 장면에서 다음 배움을 돕는 데 필요한 정보만 기록하겠습니다.","첫째, 성취기준과 연결되는 핵심 관찰 장면을 정하겠습니다. 예를 들어 토의 수업에서는 모든 발언을 받아 적기보다 학생이 근거를 말하고 친구 의견을 듣고 수정한 장면을 보겠습니다.","둘째, 짧은 점검표와 학생의 자기평가를 수업 안에 넣겠습니다. 별도의 평가 활동을 늘리지 않고 학생이 이미 작성한 초안이나 발표 자료를 활용해, 지금 잘한 점과 다음에 해 볼 행동을 알려 주겠습니다.","셋째, 동료와 평가 기준과 예시를 함께 만들고 실제 기록을 비교하겠습니다. 학생이 피드백을 받고 활동을 수정할 수 있었는지 살핀 뒤 다음 수업에서 필요한 기록 항목만 남기겠습니다.","평가의 성과는 교사가 남긴 기록의 양보다 학생이 피드백을 바탕으로 어떤 행동을 바꾸었는지에서 확인하겠습니다."]},{"title":"학생이 질문을 만드는 수업","prompt":"학생이 정답보다 질문을 만드는 수업이 필요한 이유와 운영 방법을 말하시오.","answer":["학생이 자기 질문을 만들면 무엇을 모르는지 알아차리고, 배울 내용을 자신의 관심과 연결할 수 있다고 생각합니다.","첫째, 먼저 관찰할 자료를 주겠습니다. 비가 온 뒤 운동장의 물이 고인 곳과 마른 곳 사진을 보여 주고, 학생이 눈에 들어온 차이와 궁금한 점을 적게 하겠습니다.","둘째, 사실 확인에서 이유와 탐구로 질문을 다듬도록 돕겠습니다. ‘어디에 물이 고였을까?’를 ‘바닥 재질에 따라 물이 고이는 정도가 다를까?’로 바꿔 보고, 관찰로 답할 수 있는 질문을 모둠별로 고르게 하겠습니다.","셋째, 관찰 결과가 처음 질문에 어디까지 답하는지 확인하고 질문을 다시 쓰게 하겠습니다. 말하기가 부담스러운 학생은 질문 카드나 짝 활동을 활용하게 하고, 교사는 학생의 질문을 다음 수업에 반영하겠습니다.","좋은 질문을 만드는 힘은 질문을 직접 만들고 근거를 확인해 다시 묻는 경험 속에서 자랍니다."],"tags":["질문·학습자 주도성"]},{"title":"학생 선택권과 공통 목표","prompt":"학생 선택권을 확대하면 수업 목표가 흔들릴 수 있다는 우려에 대한 생각을 말하시오.","answer":["수업의 목표와 평가 기준을 분명히 하면 학생에게 선택권을 주면서도 수업의 방향을 지킬 수 있다고 생각합니다.","첫째, 모두가 배워야 할 핵심을 학생과 확인하겠습니다. 지역 문제 해결 수업이라면 조사 대상은 달라도, 자료에 근거해 문제를 설명하고 해결책의 이유를 말하는 것이 공통 목표입니다.","둘째, 조사 대상, 맡을 역할, 표현 형식에서 선택할 기회를 주겠습니다. 학생이 선택하기 어려워할 때는 예시를 제시하고, 자신이 고른 방법으로 목표를 어떻게 이룰지 간단히 설명하게 하겠습니다.","셋째, 중간에 선택한 방법이 학습에 도움이 되는지 함께 점검하겠습니다. 자료가 부족하면 무엇을 더 조사할지 결정하게 하고, 활동 뒤에는 자신의 선택과 결과를 비교해 다음 방법을 고르게 하겠습니다.","학생이 선택에 따른 결과를 살피고 필요하면 방법을 고칠 수 있게 안내하겠습니다."],"tags":["질문·학습자 주도성"]},{"title":"체험학습의 배움과 안전","prompt":"체험학습의 교육적 효과와 안전 문제를 함께 고려한 운영 방안을 말하시오.","answer":["체험학습에서 무엇을 배울지 먼저 정하고, 학생과 인솔자가 안전하게 활동할 수 있는 조건을 갖추겠습니다.","첫째, 수업의 핵심 질문에 맞는 장소를 정하고, 사전답사와 학교 지침에 따라 이동 경로와 위험요소를 확인하겠습니다. 인솔 역할과 인원 확인, 비상 연락, 기상 악화 시 대체 활동도 계획하겠습니다.","둘째, 출발 전에 학생과 관찰 과제와 안전 약속을 익히겠습니다. 현장에서는 이동 지점마다 이름과 인원을 확인하고, 현장 여건이 달라지면 안전을 우선해 활동을 조정하겠습니다. 학생은 관찰이나 인터뷰를 통해 질문의 단서를 모으겠습니다.","셋째, 돌아온 뒤에는 현장 기록을 자료와 비교해 처음 질문에 대한 답을 정리하겠습니다. 안전과 접근성에서 불편했던 점도 듣고 동료와 점검해 다음 운영에 반영하겠습니다.","안전한 조건이 마련되어야 학생이 현장에서 질문하고 확인하는 경험에 집중할 수 있습니다."]}]},{"title":"독서·문해력·미디어","category":"디지털·문해교육","variants":[{"title":"AI 시대의 독서교육","prompt":"AI 시대에도 독서교육이 중요한 이유를 말하시오.","answer":["AI 시대일수록 원문의 맥락을 읽고 주장과 근거를 연결하는 독서교육이 중요하다고 생각합니다.","첫째, AI 요약만 보면 글쓴이의 주장은 알 수 있어도 그 주장이 나온 이유나 반대 의견을 놓치기 쉽습니다. 학생과 긴 글을 나누어 읽고 문단 사이에 어떤 관계가 있는지 표시하게 하겠습니다.","둘째, 같은 글의 원문과 AI 요약을 비교하겠습니다. 빠진 사례나 달라진 표현을 찾아 어떤 의미가 바뀌었는지 토론하고, 학생이 직접 근거를 골라 더 정확한 요약을 쓰게 하겠습니다.","셋째, 독서를 질문과 대화로 이어 가겠습니다. 예를 들어 인물이 한 선택을 두고 친구마다 다른 해석을 제시하면, 학생들이 책의 문장을 근거로 서로의 해석을 검토하도록 돕겠습니다.","읽은 내용을 자기 말로 다시 설명하고, 어떤 근거를 믿을지 판단하는 힘을 기르겠습니다."]},{"title":"숏폼과 집중력·문해력","prompt":"숏폼 영상에 익숙한 학생의 집중력과 문해력을 높일 방안을 말하시오.","answer":["짧은 영상에서 출발해 더 긴 글을 읽고 여러 자료를 확인하는 경험으로 이어 가겠습니다.","첫째, 학생이 본 영상의 핵심 주장과 빠진 정보를 적게 하겠습니다. 관련 기사나 책을 읽으며 영상의 주장과 다른 자료의 근거를 비교하고, 더 알고 싶은 질문을 하나 정하게 하겠습니다.","둘째, 읽기는 처음부터 긴 시간을 요구하지 않고 짧은 문단부터 시작하겠습니다. 핵심 문장에 표시하고 내용을 짝에게 설명하게 하며, 익숙해지면 여러 문단을 이어 읽도록 시간을 늘리겠습니다.","셋째, 학생이 자료를 바탕으로 정확한 짧은 영상을 직접 기획하게 하겠습니다. 재미를 위해 내용을 빠뜨리거나 사실을 과장하지 않았는지 서로 확인하고, 출처를 설명하도록 하겠습니다.","매체를 스스로 멈추고 생각하는 경험이 쌓이면 학생이 필요한 정보를 끝까지 읽고 판단할 수 있습니다."]},{"title":"가짜뉴스와 미디어 문해력","prompt":"가짜뉴스와 인포데믹스에 대응하기 위해 초등학생에게 어떤 능력을 길러야 하는가?","answer":["학생에게 자료를 보자마자 믿거나 보내기 전에 출처와 근거를 확인하는 습관을 길러 주겠습니다.","첫째, 먼저 누가 언제 어떤 목적으로 만들었는지 확인하도록 하겠습니다. 제목이 강한 감정을 일으킬 때 본문을 읽고, 사진과 제목이 실제 같은 사건을 다루는지도 확인하게 하겠습니다.","둘째, 한 게시물이 인용한 수치와 문장을 원래 자료에서 찾아보게 하겠습니다. 다른 신뢰할 수 있는 출처와 비교하고, 사진이나 그래프가 일부만 잘려 의미가 달라질 수 있음을 예시로 살피겠습니다.","셋째, 친구의 메시지를 받았을 때 바로 보내지 않고 확인하는 상황을 역할극으로 연습하겠습니다. 근거가 부족하면 판단을 보류하고 잘못 전한 사실을 알게 되면 바로잡게 하겠습니다.","정보를 판단할 때는 무엇을 믿었는지와 함께 어떤 근거를 확인했는지 말할 수 있어야 합니다."]},{"title":"초등 저학년 한글책임교육","prompt":"초등 저학년 한글책임교육을 효과적으로 운영할 방법을 말하시오.","answer":["입학 초부터 학생의 수준을 살피고 누구나 학교에서 소리와 글자를 연결해 읽고 쓸 기회를 갖게 하겠습니다.","첫째, 교실에서 이름과 익숙한 낱말을 읽는 짧은 활동을 하며 어떤 글자에서 어려워하는지 확인하겠습니다. 낱말을 통째로 기억하는지, 글자와 소리를 연결할 수 있는지도 관찰하겠습니다.","둘째, 충분한 연습이 필요한 글자부터 소리 놀이와 글자 조합 활동으로 지도하겠습니다. 그림책과 교실 안내문을 활용해 배운 글자를 문장 속에서 읽고 직접 써 보게 하겠습니다.","셋째, 짧은 확인 활동을 바탕으로 소집단이나 개별 지도를 조정하겠습니다. 보호자에게는 학생이 할 수 있게 된 부분과 집에서 부담 없이 함께 읽을 수 있는 방법을 안내하겠습니다.","한글 학습의 출발점을 학교가 책임지고, 학생이 다른 교과에서도 글을 읽고 배울 기반을 마련하겠습니다."]},{"title":"학생 주도형 학교도서관","prompt":"학교도서관을 학생 주도적 배움의 공간으로 만드는 방안을 말하시오.","answer":["학교도서관을 학생이 읽을 책을 고르고 질문을 발전시키며 배움을 나누는 공간으로 운영하겠습니다.","첫째, 학생이 재미있게 읽은 책과 읽어 보고 싶은 주제를 제안하도록 하겠습니다. 학생과 사서교사가 주제별 전시를 함께 꾸미고, 평소 책을 자주 읽지 않는 학생의 의견도 들어 보겠습니다.","둘째, 교과 프로젝트에서 나온 질문을 도서관에서 탐구하게 하겠습니다. 예를 들어 지역의 옛 모습을 조사할 때 책과 사진 자료, 공공기관 자료를 함께 찾아 출처와 관점을 비교하도록 돕겠습니다.","셋째, 독서 모임이나 책 소개 시간에 학생이 역할과 발표 방법을 고르게 하겠습니다. 활동 뒤에는 어떤 책에서 새 질문이 생겼는지, 다음에는 무엇을 더 찾아볼지 학생이 직접 정하게 하겠습니다.","학생이 자신의 질문을 들고 찾아와 자료와 사람을 만나 한 걸음 더 배우는 도서관을 만들겠습니다."],"tags":["질문·학습자 주도성"]}]},{"title":"생태·지역·세계시민","category":"학교·지역사회","variants":[{"title":"부산과 연계한 생태전환교육","prompt":"부산의 지역 특성을 살린 생태전환교육 활동을 제안하시오.","answer":["부산의 해안과 낙동강 하구를 활용해 학생이 우리 지역의 자연을 관찰하고 실천으로 이어 가는 프로젝트를 제안합니다.","첫째, 예를 들어 ‘해안과 하구의 생물은 어떤 환경에서 살아갈까?’를 공통 질문으로 삼겠습니다. 학생은 지도와 사진을 보고 모둠별 질문을 정하고, 안전하게 관찰 가능한 장소와 방법을 살피겠습니다.","둘째, 현장에서 쓰레기의 종류와 위치, 생물의 흔적을 약속한 방법으로 기록하겠습니다. 학생들이 직접 관찰한 사실과 추측을 나누고, 지역 기관의 공개 자료와 비교해 근거를 확인하게 하겠습니다.","셋째, 학생이 조사 결과를 바탕으로 학교에서 실천할 감축 방법이나 시민 안내물을 제안하도록 하겠습니다. 활동 전후의 변화를 살펴 효과가 부족했던 곳은 이유를 찾아 다시 조정하겠습니다.","부산에서 직접 본 환경 문제를 근거로 지역의 변화를 제안하고, 그 결과를 확인하는 활동으로 만들겠습니다."]},{"title":"기후위기 교육과 학생 불안","prompt":"기후위기의 심각성을 강조하는 교육이 학생에게 불안을 줄 수 있다는 의견에 대해 말하시오.","answer":["기후위기를 학생의 발달 수준에 맞게 설명하고, 이미 이루어지는 변화와 대응 방법을 함께 보여 주겠습니다.","첫째, 불안을 자극하는 영상에만 의존하지 않고 지역의 폭염이나 해안 변화처럼 이해할 수 있는 자료를 고르겠습니다. 학생이 궁금한 점과 걱정되는 부분을 표현할 수 있게 시간을 마련하겠습니다.","둘째, 학교에서 실천할 만한 문제를 학생과 고르겠습니다. 예를 들어 급식 잔반이 줄어드는 방법을 시험하고 전후의 양을 비교해, 작은 실천도 실제 차이를 만들 수 있는지 확인하게 하겠습니다.","셋째, 가정과 개인의 실천 외에도 지자체와 지역사회, 기업이 할 수 있는 일을 함께 살피겠습니다. 변화 사례를 비교한 뒤 학생이 학교와 지역에 제안할 수 있는 일을 정하게 하겠습니다.","학생이 기후 문제를 사실에 근거해 이해하고, 자신이 다른 사람과 함께 할 수 있는 일을 찾도록 돕겠습니다."]},{"title":"지속 가능한 학교 탄소중립","prompt":"학교의 탄소중립 실천이 보여주기식 행사에 그치지 않도록 하는 방법을 말하시오.","answer":["학교 탄소중립은 학생이 실제 자료를 살피고 학교가 제안에 응답하는 활동으로 꾸준히 운영해야 한다고 생각합니다.","첫째, 학생들과 잔반량, 종이 사용량, 전기 사용과 같이 학교에서 확인할 수 있는 지표를 고르겠습니다. 같은 조건에서 정기적으로 기록해 많이 사용하는 시간이나 장소를 찾겠습니다.","둘째, 학급이나 학생자치회가 실천안을 제안하고 학교는 시설과 예산, 운영 방법을 살펴 실행 여부와 이유를 알려 주겠습니다. 학생이 제안하고 학교가 실제로 반영하는 과정을 경험하게 하겠습니다.","셋째, 실천 뒤에는 처음과 같은 기준으로 수치를 비교하겠습니다. 기대보다 변화가 적으면 조사 조건과 참여 방법부터 돌아보고, 학생들과 실행 계획을 다시 정하겠습니다.","학교가 학생의 기록과 결정으로 무엇을 바꾸었는지 확인할 수 있을 때, 탄소중립이 일상에 자리 잡습니다."]},{"title":"민주시민교육과 정치적 중립","prompt":"민주시민교육에서 교사가 정치적 중립을 지키는 방법을 말하시오.","answer":["사회적 쟁점을 다룰 때 교사의 권한을 이용해 특정 입장을 따르게 하지 않고, 학생이 자료를 살펴 판단하도록 돕겠습니다.","첫째, 수업 목표를 자료 읽기와 근거 제시, 서로 다른 입장 이해로 정하겠습니다. 학생의 경험에 가까운 지역 문제를 선정하고, 신뢰할 수 있는 자료와 여러 관점을 균형 있게 제시하겠습니다.","둘째, 토의에서는 먼저 친구의 주장을 자신의 말로 정리한 뒤 질문하게 하겠습니다. 교사는 학생의 반대나 유보를 존중하고, 인신 공격이나 편견이 드러나는 말은 중단시켜 안전하게 대화할 조건을 만들겠습니다.","셋째, 평가에서는 의견의 방향에 점수를 주지 않고, 근거가 적절한지와 다른 주장을 듣고 자신의 생각을 검토했는지 살피겠습니다. 수업을 돌아보며 자료나 진행이 한쪽에 치우치지 않았는지 동료와 점검하겠습니다.","학생이 속한 집단이나 교사의 입장과 관계없이, 사실과 근거를 바탕으로 스스로 판단하고 말할 수 있게 하겠습니다."]},{"title":"지역사회 연계 초등교육","prompt":"지역사회와 연계한 초등교육이 필요한 이유와 교사의 역할을 말하시오.","answer":["지역과 연계한 수업은 학생이 교과에서 배운 내용을 자신이 사는 곳에서 확인하고 지역의 일에 참여하게 한다는 점에서 필요합니다.","첫째, 학생이 자주 지나는 골목이나 해안, 시장에서 궁금한 점을 찾아 교과의 질문으로 바꾸겠습니다. 예를 들어 청사포의 예전과 오늘을 사진과 지도로 비교하며 마을이 어떻게 달라졌는지 살피겠습니다.","둘째, 지역 주민과 박물관, 도서관 등과 협력해 여러 이야기를 듣도록 하겠습니다. 교사는 실제 배울 목표와 안전을 확인하고, 인터뷰나 촬영 전에 참여와 공개 범위를 안내하겠습니다.","셋째, 학생이 발견한 점을 전시나 지도, 제안서로 정리해 지역 구성원과 나누게 하겠습니다. 받은 의견을 검토해 자료를 고치고, 자신이 배운 내용이 지역에서 어떻게 쓰일 수 있는지 돌아보게 하겠습니다.","학생의 배움이 자신이 사는 곳을 이해하고 돌보는 행동으로 이어지게 하겠습니다."]}]},{"title":"교육정책·학교 변화","category":"학교·지역사회","variants":[{"title":"온동네 초등돌봄·교육의 역할 분담","prompt":"온동네 초등돌봄·교육 확대에서 학교와 지역사회의 역할을 어떻게 나누어야 하는가?","answer":["학교와 지역사회가 역할을 명확히 나누고, 학생이 어디에서든 안전하고 안정적으로 돌봄과 교육을 받도록 협력해야 한다고 생각합니다.","첫째, 학교는 학생과 보호자의 수요를 듣고 학교 교육과 연결할 활동을 협의하겠습니다. 필요한 정보는 목적에 맞는 범위에서만 공유하고, 학생이 프로그램에 쉽게 참여할 수 있도록 이용 방법을 안내하겠습니다.","둘째, 지자체와 돌봄기관은 지역의 공간과 인력, 문화·체육 자원을 연결해 프로그램을 운영할 수 있습니다. 교육지원청은 학교와 기관 사이의 조정을 돕고 지역별로 이용 기회 차이가 큰지 함께 살펴야 합니다.","셋째, 운영 기관들과 강사 확인, 귀가 인계, 응급 연락 등 공통 안전 기준을 정하겠습니다. 보호자가 여러 곳에 같은 문의를 하지 않도록 창구를 안내하고, 이동이나 이용이 어려운 학생의 참여 여부도 점검하겠습니다.","돌봄의 수준을 운영 시간만으로 판단하지 않고, 도움이 필요한 학생이 실제로 안전하게 이용할 수 있는지 살피겠습니다."]},{"title":"학생맞춤통합지원의 조건","prompt":"학생맞춤통합지원이 학교에서 제대로 작동하기 위한 조건을 말하시오.","answer":["학생과 보호자의 이야기를 중심으로 학교 안팎의 도움을 연결하고, 무엇이 달라졌는지 함께 확인해야 한다고 생각합니다.","첫째, 예를 들어 결석이 늘고 수업 참여가 줄었다면, 그 사실을 기록하고 학생이 무엇을 가장 힘들어하는지 듣겠습니다. 보호자와 대화하며 기존에 받은 지원과 학생이 이미 잘하는 점도 확인하겠습니다.","둘째, 학교의 지원 협의 과정에서는 필요한 정보만 공유하고 역할을 나누겠습니다. 담임은 수업 참여를 도울 목표를 정하고, 상담과 복지 담당자는 필요한 지원을 연결하겠습니다. 학교만으로 부족하면 교육지원청과 지역 기관에 협력을 요청하겠습니다.","셋째, 출석과 과제 수행뿐 아니라 학생이 체감하는 변화도 일정한 간격으로 확인하겠습니다. 연결한 지원이 실제로 시작됐는지 점검하고, 학생과 보호자 의견을 들으며 계획을 조정하겠습니다.","여러 기관의 도움을 연결한 결과가 한 학생의 학교생활에서 어떤 변화로 나타났는지까지 살피겠습니다."]},{"title":"교사 행정업무와 AI","prompt":"교사의 행정업무를 AI로 줄이는 것의 장점과 주의점을 말하시오.","answer":["AI로 반복 업무 시간을 줄일 수 있다고 생각합니다. 활용 범위와 교사의 검토 책임을 분명히 하겠습니다.","첫째, 민감 정보가 없는 자료의 분류, 공개 문서의 요약, 가정통신문 초안 작성 등에 활용하겠습니다. 반복 작성 시간이 줄면 학생 상담이나 수업 준비에 그 시간을 쓸 수 있습니다.","둘째, 학교에서 허용한 도구와 기준을 확인하고 학생 이름이나 상담 내용, 평가 자료가 외부 도구에 들어가지 않도록 주의하겠습니다. 요약 내용은 원문과 대조하고 안내문의 날짜와 대상도 직접 확인하겠습니다.","셋째, 평가, 상담, 학생 지원처럼 권리와 배움에 영향을 미치는 결정은 교사가 근거를 검토하고 책임지겠습니다. 업무가 정말 줄었는지와 오류가 생기지 않았는지 동료와 점검하겠습니다.","절약된 시간을 학생을 이해하고 수업을 준비하는 데 돌릴 수 있는지까지 보겠습니다."]},{"title":"초등학교 교과전담제 확대","prompt":"초등학교 교과전담제를 확대하는 것에 대한 의견을 말하시오.","answer":["전문성이 필요한 교과에는 전담교사를 확대할 수 있다고 생각합니다. 학년별 발달과 담임의 학생 이해가 수업에 이어지도록 협력해야 합니다.","첫째, 예체능이나 과학처럼 실기 지도와 안전한 활동 운영이 필요한 분야에서 교과전담의 전문성을 활용하겠습니다. 학교는 학생의 필요와 교사의 역량을 살펴 어느 교과에서 도움이 큰지 판단해야 합니다.","둘째, 담임과 전담교사가 수업 목표를 미리 공유하고, 관찰한 학생의 강점과 어려움은 필요한 범위에서 나누겠습니다. 교과 프로젝트는 담임과 전담이 함께 설계해 다른 수업과의 연결을 살리겠습니다.","셋째, 저학년은 안정적인 관계와 생활 적응을 고려하겠습니다. 운영 뒤에는 학생이 느낀 수업의 연속성과 참여도, 교사의 협의 여건을 살피고 학년별 운영 방법을 조정하겠습니다.","담임의 학생 이해와 전담교사의 전문성이 만날 때 초등 수업의 깊이와 연속성이 함께 높아집니다."]},{"title":"사교육비 문제와 초등학교","prompt":"사교육비 증가 문제를 줄이기 위해 초등학교가 할 수 있는 일을 말하시오.","answer":["학교가 기본 학습과 깊이 있는 탐구, 다양한 체험을 안정적으로 제공하면 사교육에 대한 일부 불안을 줄일 수 있다고 생각합니다.","첫째, 수업 중 짧은 확인과 피드백으로 학생이 어디에서 막혔는지 빨리 살피겠습니다. 필요한 학생에게 보충을 제공하고 이미 이해한 학생에게는 배운 개념을 새 상황에 적용하는 과제를 마련하겠습니다.","둘째, 방과후나 돌봄 시간에는 지역 기관과 협력해 문화·예술, 체육, 탐구 활동에 참여할 기회를 넓히겠습니다. 시간과 비용 때문에 특정 학생이 이용하기 어려운 프로그램이 있는지도 살피겠습니다.","셋째, 학생과 보호자에게 현재 배우는 목표와 학생의 성장을 구체적으로 안내하겠습니다. 가정에서 부담 없이 할 수 있는 독서와 놀이를 소개하고 학교에서 지원받는 방법도 쉽게 설명하겠습니다.","가정의 여건과 관계없이 학교에서 기본 학습과 다양한 도전의 기회를 누리게 하겠습니다."]}]},{"title":"교직관·예비교사 성장","category":"교직관·예비교사 성장","variants":[{"title":"AI 시대 교사의 고유한 역할","prompt":"AI 시대에 교사만이 할 수 있는 고유한 역할을 말하시오.","answer":["학생의 생활 맥락과 관계를 이해하고, 모두가 함께 배우도록 판단하고 책임지는 일이 초등교사의 고유한 역할이라고 생각합니다.","첫째, AI 기록에서 오답이 늘면 학생의 개념 이해와 과제 수행을 직접 살피겠습니다. 학생이 같은 문제를 풀 때 친구 앞에서 말하기를 어려워하는지, 설명을 이해하지 못했는지 대화와 관찰을 통해 알아보겠습니다.","둘째, 학생이 서로 듣고 협력하며 배울 기회를 설계하겠습니다. 모둠에서 갈등이 생기면 친구가 말한 뜻을 확인하고 자신이 원하는 것을 안전하게 표현하도록 도와 공동체 안에서 다시 참여할 길을 마련하겠습니다.","셋째, AI가 제공하는 자료는 학년과 학생에 맞는지 검토하고, 개인정보 보호와 공정성을 확인하겠습니다. 지원이나 평가를 결정할 때 사용한 근거와 책임을 학생과 보호자에게 설명하겠습니다.","기술이 학생의 학습을 도울 수 있도록, 학생과 관계를 맺고 결과에 책임지는 교사가 되겠습니다."]},{"title":"좋은 초등교사의 핵심 역량","prompt":"좋은 초등교사가 갖추어야 할 가장 중요한 역량 한 가지와 그 이유를 말하시오.","answer":["가장 중요한 역량은 학생의 반응을 살피고 그 근거로 수업을 조정하는 성찰적 실천 역량이라고 생각합니다.","첫째, 같은 오답을 내도 어려움의 원인은 다를 수 있습니다. 글의 중심 내용을 찾지 못한 두 학생 중 한 사람은 낱말 뜻을, 다른 사람은 문단의 구조를 어려워할 수 있습니다. 학생의 설명을 들어야 필요한 도움을 정할 수 있습니다.","둘째, 관찰한 내용을 바탕으로 지원을 달리하겠습니다. 낱말 뜻은 그림이나 문맥으로 확인하고, 글의 구조는 중심 문장과 예시를 구분하는 연습으로 돕겠습니다. 새 글에서 학생이 그 방법을 사용해 보는지도 확인하겠습니다.","셋째, 대학과 실습 현장에서 학생 활동을 기록하고 동료 및 지도교사와 함께 검토하겠습니다. 제가 예상한 반응과 실제 모습이 다르면 이유를 돌아보고 질문과 자료를 바꾸어 보겠습니다.","학생에게 기대한 변화가 실제로 일어났는지 확인하고, 그 결과를 다음 수업에 반영하는 교사가 되겠습니다."]},{"title":"부산교대에서의 성장 계획","prompt":"부산교육대학교에서 어떤 예비교사로 성장하고 싶은지 말하시오.","answer":["저는 학생의 질문을 부산의 자연과 역사에 연결하고, 모든 학생이 탐구에 참여할 수 있는 수업을 설계하는 예비교사로 성장하고 싶습니다.","첫째, [나의 실제 경험]을 통해 [그 경험에서 배운 점]을 느꼈습니다. 이를 바탕으로 대학에서 아동발달과 교과교육을 공부하고 교육봉사와 실습에서 학생들이 어디에서 질문하고 어려워하는지 살피겠습니다.","둘째, 부산의 지역 자원을 활용한 수업을 구상하겠습니다. 예를 들어 청사포의 바다와 마을 생활을 주제로, 학생이 지도와 사진을 비교해 질문을 만들고 지역 주민의 관점을 조사하는 사회과 수업을 설계해 보겠습니다.","셋째, 동료와 수업안을 함께 검토하고 실습에서 만난 학생의 반응을 바탕으로 개선하겠습니다. 참여하기 어려운 학생이 있었다면 자료와 질문 방법을 다시 살피고 표현 방법을 넓히겠습니다.","부산교대에서 배운 것을 학생의 질문과 참여가 살아 있는 실제 수업으로 발전시키겠습니다."],"note":"대괄호에는 실제 경험과 그 경험에서 배운 점을 넣어 말해 보세요."},{"title":"교사가 실수를 인정하는 태도","prompt":"교사가 자신의 실수를 학생에게 인정하는 것이 바람직한지 말하시오.","answer":["교사는 학생 앞에서 사실이나 판단의 실수를 확인하면 솔직히 인정하고 수정하는 것이 바람직하다고 생각합니다.","첫째, 수업에서 자료를 잘못 해석했다면 어떤 내용이 잘못되었고 무엇을 근거로 바로잡는지 설명하겠습니다. 학생이 혼란을 겪었다면 필요한 내용을 다시 다루고 질문할 시간을 주겠습니다.","둘째, 생활지도에서 학생의 말을 충분히 듣지 않고 판단했다면 학생에게 따로 설명하고 영향에 대해 사과하겠습니다. 기록이나 결정에 수정이 필요하면 학교 절차에 따라 바로잡겠습니다.","셋째, 같은 일이 반복되지 않도록 확인 절차를 보완하겠습니다. 예를 들어 자료 출처를 수업 전에 한 번 더 확인하고, 갈등 상황에서는 학생들의 이야기를 따로 듣겠습니다. 학생도 자기 실수를 안전하게 고칠 수 있게 격려하겠습니다.","교사가 오류를 인정하고 책임 있게 고치는 모습을 학생이 직접 볼 수 있게 하겠습니다."]},{"title":"예상 밖 면접 질문에 대처하기","prompt":"면접에서 준비하지 못한 질문을 받았을 때 어떻게 답할 것인가?","answer":["예상하지 못한 질문을 받으면 잠시 생각을 정리하고, 제가 중요하게 보는 기준과 가능한 행동을 차례로 말씀드리겠습니다.","첫째, 질문의 핵심이 무엇인지 먼저 확인하겠습니다. 조건이 모호하면 제가 이해한 상황을 짧게 말씀드리거나 필요한 부분을 여쭙고, 정책의 세부 내용이 확실하지 않으면 확인이 필요하다고 말하겠습니다.","둘째, 학생의 안전과 배움, 공정성을 기준으로 우선순위를 정하겠습니다. 예를 들어 친구 갈등 사례라면 즉시 안전을 확보하는 행동과 이후 학생의 이야기를 듣고 지원하는 행동을 시간 순으로 설명하겠습니다.","셋째, 가능한 방법을 고른 이유와 확인할 점까지 말하겠습니다. 제 판단이 달라질 수 있는 조건을 밝히고, 필요하면 어떤 교직원이나 절차를 통해 확인하고 협력할지 설명하겠습니다.","처음 만난 질문에서도 학생에게 어떤 영향이 있을지 근거를 들어 판단하고, 책임 있게 답하겠습니다."]}]}];
function flattenTopics(topics) {
  return topics.flatMap(topic => topic.variants.map((variant, index) => ({

}

function updateTimer() {

  el('start').textContent = deadline !== null ? '일시정지' : remaining === 0 ? '다시 시작' : remaining === duration ? '시작' : '계속';
  el('reset').disabled = remaining === duration && deadline === null;

function stopTimer() {

function tick() {
  if (deadline === null) return;
  remaining = Math.max(0, deadline - Date.now());
  if (remaining === 0) {
    stopTimer();
    el('timer-message').textContent = '2분이 지났습니다. 모범 답변과 비교해 보세요.';
  }
  updateTimer();

function toggleTimer() {
  if (deadline !== null) {
    tick();

    stopTimer();
    el('timer-message').textContent = '일시정지했습니다.';
  } else {
    if (remaining === 0) remaining = duration;
    deadline = Date.now() + remaining;
    ticker = setInterval(tick, 100);

const paper = el('pdf-paper');

function wrap(ctx, paragraph, maxWidth) {

    if (ctx.measureText(candidate).width <= maxWidth) {

    if (line) lines.push(line);
    line = '';
    for (const char of word) {

}

function makePdf(jpegs) {

      put(jpeg);
