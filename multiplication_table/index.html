<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구구단 학습지 만들기</title><style>:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#24334a}*{box-sizing:border-box}body{margin:0;background:#eef4ff}.wrap{max-width:1100px;margin:auto;padding:24px}header{background:linear-gradient(110deg,#4169e1,#7c58d6);color:white;border-radius:20px;padding:25px}h1{margin:0 0 8px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;background:white;padding:20px;border-radius:18px;margin:18px 0;box-shadow:0 4px 16px #24334a15}label{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:11px;border:1px solid #ccd5e3;border-radius:9px;font-size:15px}.checks{display:flex;flex-wrap:wrap;gap:8px}.checks label{border:1px solid #ccd5e3;border-radius:9px;padding:7px;font-weight:500}.checks input{width:auto}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}button{background:#4169e1;color:white;border:0;padding:12px 18px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}button.secondary{background:#fff;color:#304fc0;border:1px solid #aebce9}.paper{background:white;width:210mm;min-height:297mm;margin:16px auto;padding:17mm 16mm;box-shadow:0 3px 18px #0002}.sheethead{text-align:center;border-bottom:3px solid #384b77;padding-bottom:12px}.sheethead h2{font-size:27px;margin:0 0 8px}.meta{display:flex;justify-content:space-between;margin-top:14px}.sectiontitle{margin:22px 0 12px;font-size:18px;color:#304fc0}.problems{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 15px}.problem{border:1px solid #d5dce8;border-radius:8px;min-height:51px;padding:13px 8px;font-size:18px;white-space:nowrap}.num{color:#7b8496;font-size:12px;margin-right:7px}.answer{display:inline-block;min-width:39px;border-bottom:1px solid #555;height:19px}.footer{margin-top:25px;border-top:1px dashed #abb6c9;padding-top:10px;font-size:13px;color:#64748b}.answerkey .problem{min-height:43px;font-size:16px}.hidden{display:none!important}@page{size:A4;margin:0}@media print{body{background:white}.wrap{padding:0;max-width:none}header,.controls,.actions,.tip{display:none!important}.paper{margin:0;box-shadow:none;min-height:297mm;page-break-after:always;break-after:page}.paper:last-child{page-break-after:auto;break-after:auto}.problem{break-inside:avoid}}@media(max-width:850px){.paper{width:100%;min-height:auto;padding:22px}.problems{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.problems{grid-template-columns:1fr}}.problem input.student-answer{width:74px;max-width:40%;padding:6px;text-align:center;font-size:19px;font-weight:700;border:2px solid #b8c7e5;background:#f8fbff}.problem.correct{background:#e9f9ef;border-color:#65ba80}.problem.wrong{background:#fff0ee;border-color:#e99a91}.feedback{font-size:13px;font-weight:bold;margin-left:5px}.correct .feedback{color:#147a3c}.wrong .feedback{color:#b7352c}.scoreboard{background:#fff;border:2px solid #a8baf6;border-radius:14px;padding:16px;margin:14px 0;font-size:18px;font-weight:bold}.scoreboard small{font-size:13px;font-weight:normal}.problem:focus-within{outline:2px solid #426ae3}.story-answer{margin-top:8px}.answerkey{display:none}.show-key .answerkey{display:block}@media print{.scoreboard,.interactive-only{display:none!important}.problem input.student-answer{border:0;border-bottom:1px solid #555;border-radius:0;background:white}.feedback{display:none!important}.problem.correct,.problem.wrong{background:white;border-color:#d5dce8}.answerkey{display:none!important}.show-key .answerkey{display:block!important}} </style></head><body><main class="wrap"><header><h1>✏️ 구구단 학습지 만들기</h1><div>로그인 없이 직접 답 입력 · 자동 채점 · 오답 다시 풀기 · A4 인쇄</div></header><div class="controls"><div><label>연습할 단 (여러 개 선택)</label><div class="checks" id="dans"></div></div><div><label for="type">문제 유형</label><select id="type"><option value="mixed">혼합형 (곱셈 + 빈칸)</option><option value="normal">곱셈 계산</option><option value="missing">빈칸에 알맞은 수</option><option value="ordered">단별 순서대로</option><option value="story">생활 속 문장제</option></select></div><div><label for="count">문제 수</label><select id="count"><option>10</option><option>20</option><option selected>30</option><option>40</option><option>50</option><option>100</option></select><label for="level" style="margin-top:12px">난이도</label><select id="level"><option value="easy">쉬움 (×1~5)</option><option value="all" selected>보통 (×1~9)</option><option value="hard">도전 (×6~9 중심)</option></select></div><div><label for="name">학습지 제목</label><input id="name" value="구구단 실력 쑥쑥!" maxlength="35"><label for="pages" style="margin-top:12px">정답지 포함</label><select id="pages"><option value="yes" selected>포함</option><option value="no">제외</option></select></div></div><div class="actions"><button id="make">🔄 새로운 문제 만들기</button><button id="grade">✅ 채점하기</button>
<button id="retry" class="secondary">✏️ 틀린 문제 다시 풀기</button>
<button id="reveal" class="secondary">📖 정답지 보기/숨기기</button>
<button id="print" class="secondary">🖨️ 인쇄 / PDF 저장</button><button id="all" class="secondary">2~9단 모두 선택</button></div><p class="tip">※ 문제는 매번 새롭게 생성됩니다. 인쇄 화면에서 ‘PDF로 저장’을 선택하면 PDF 학습지를 만들 수 있습니다. 40문제 이상은 여러 장으로 자동 분할됩니다.</p><div id="scoreboard" class="scoreboard" role="status" aria-live="polite">문제의 빈칸을 눌러 답을 입력하세요. 모두 풀었다면 ‘채점하기’를 누르세요.</div>
<div id="output"></div></main><script>const $=id=>document.getElementById(id);const dans=$('dans');for(let d=2;d<=9;d++){let l=document.createElement('label');l.innerHTML=`<input type="checkbox" value="${d}" checked> ${d}단`;dans.append(l)}$('all').onclick=()=>dans.querySelectorAll('input').forEach(x=>x.checked=true);$('print').onclick=()=>window.print();$('make').onclick=generate; $('grade').onclick=grade; $('retry').onclick=retryWrong; $('reveal').onclick=()=>document.body.classList.toggle('show-key');const rand=a=>a[Math.floor(Math.random()*a.length)];const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const stories=[(a,b)=>`사탕이 한 봉지에 ${a}개씩 있습니다. ${b}봉지에는 모두 몇 개일까요?`,(a,b)=>`한 줄에 꽃이 ${a}송이씩 있습니다. ${b}줄에는 모두 몇 송이일까요?`,(a,b)=>`상자 하나에 연필이 ${a}자루씩 있습니다. ${b}상자에는 몇 자루일까요?`,(a,b)=>`책상 한 개에 학생이 ${a}명씩 앉습니다. 책상 ${b}개에 모두 몇 명이 앉을까요?`];function generate(){let ds=[...dans.querySelectorAll('input:checked')].map(x=>+x.value);if(!ds.length){alert('연습할 단을 하나 이상 선택하세요.');return}let count=+$('count').value,type=$('type').value,level=$('level').value,bs=level==='easy'?[1,2,3,4,5]:level==='hard'?[6,7,8,9]:[1,2,3,4,5,6,7,8,9];let pool=[];for(let a of ds)for(let b of bs)pool.push([a,b]);if(type!=='ordered')shuffle(pool);let items=[];for(let i=0;i<count;i++){let [a,b]=pool[i%pool.length];if(i>0&&i%pool.length===0&&type!=='ordered')shuffle(pool);let mode=type==='mixed'?(i%3===0?'missing':'normal'):type;let question='',answer=a*b;if(mode==='story')question=rand(stories)(a,b);else if(mode==='missing'){if(i%2)question=`□ × ${b} = ${a*b}`;else question=`${a} × □ = ${a*b}`;answer=i%2?a:b}else question=`${a} × ${b} =`;items.push({question,answer,mode})}window.currentItems=items; $('scoreboard').textContent='총 '+items.length+'문제입니다. 답을 입력한 뒤 채점하기를 누르세요.'; document.body.classList.remove('show-key');let out=$('output');out.innerHTML='';let pageSize=type==='story'?8:30;for(let start=0;start<items.length;start+=pageSize){let subset=items.slice(start,start+pageSize);out.append(makePage(subset,start,false))}if($('pages').value==='yes'){for(let start=0;start<items.length;start+=pageSize)out.append(makePage(items.slice(start,start+pageSize),start,true))}}function makePage(items,start,isKey){let el=document.createElement('section');el.className='paper'+(isKey?' answerkey':'');let title=document.createElement('div');title.className='sheethead';let h=document.createElement('h2');h.textContent=$('name').value+(isKey?' — 정답지':'');title.append(h);let meta=document.createElement('div');meta.className='meta';meta.innerHTML=`<span>날짜: ______년 ____월 ____일</span><span>${isKey?'정답 확인':'학년: ____ 반: ____ 이름: __________'}</span>`;title.append(meta);el.append(title);let sec=document.createElement('h3');sec.className='sectiontitle';sec.textContent=isKey?'정답을 확인해 보세요!':'차근차근 풀어 보세요!';el.append(sec);let grid=document.createElement('div');grid.className='problems';if(items[0]?.mode==='story')grid.style.gridTemplateColumns='1fr';items.forEach((p,i)=>{let item=document.createElement('div');item.className='problem';if(p.mode==='story')item.style.whiteSpace='normal';let n=document.createElement('span');n.className='num';n.textContent=`${start+i+1}.`;item.append(n,document.createTextNode(p.question+' '));if(isKey){let a=document.createElement('strong');a.textContent=p.answer;item.append(a)}else{let a=document.createElement('input');a.className='student-answer';a.type='number';a.min='0';a.inputMode='numeric';a.setAttribute('aria-label',`${start+i+1}번 답 입력`);a.dataset.index=start+i;a.autocomplete='off';a.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();let inputs=[...document.querySelectorAll('.student-answer')];let next=inputs[inputs.indexOf(a)+1];if(next)next.focus();else grade()}});item.append(a);let f=document.createElement('span');f.className='feedback';item.append(f)}grid.append(item)});el.append(grid);let foot=document.createElement('div');foot.className='footer';foot.textContent=isKey?'스스로 채점하며 틀린 문제를 다시 풀어 보세요.':'오늘도 한 걸음 성장했어요! ⭐';el.append(foot);return el}function grade(){let inputs=[...document.querySelectorAll('.student-answer')],right=0,wrong=0,blank=0;for(let input of inputs){let item=window.currentItems[+input.dataset.index],box=input.closest('.problem'),feedback=box.querySelector('.feedback');box.classList.remove('correct','wrong');if(input.value.trim()===''){blank++;feedback.textContent='미입력';continue}if(Number(input.value)===item.answer){right++;box.classList.add('correct');feedback.textContent='✓ 정답'}else{wrong++;box.classList.add('wrong');feedback.textContent='✕ 다시 도전'}}let total=inputs.length; $('scoreboard').innerHTML=`🎉 정답 ${right}개 / ${total}문제 · 점수 ${Math.round(right/total*100)}점 <small>(오답 ${wrong}개, 미입력 ${blank}개)</small>`;if(wrong||blank)$('scoreboard').innerHTML+=' <small>틀린 문제를 다시 풀고 채점해 보세요!</small>'}function retryWrong(){let inputs=[...document.querySelectorAll('.student-answer')],first=null;for(let input of inputs){let box=input.closest('.problem');if(!box.classList.contains('correct')){input.value='';box.classList.remove('wrong');box.querySelector('.feedback').textContent='';if(!first)first=input}}if(first){first.focus();$('scoreboard').textContent='틀렸거나 풀지 않은 문제를 다시 풀어 보세요.'}else $('scoreboard').textContent='모든 문제를 맞혔습니다! 🎉'}generate();</script></body></html>
