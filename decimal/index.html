<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소수 탐험대</title><style>:root{font-family:'Malgun Gothic',sans-serif;color:#20324b;background:#f2f7ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:950px;margin:auto;padding:22px}header{background:linear-gradient(110deg,#2563eb,#14b8a6);color:white;padding:24px;border-radius:20px}h1{margin:0 0 8px}h2{margin:0 0 15px}.panel{background:white;padding:22px;border-radius:18px;margin:18px 0;box-shadow:0 3px 12px #1232  }button,select,input{font:inherit}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;margin:4px}button.secondary{background:#e5edf9;color:#1e40af}button:disabled{opacity:.45;cursor:not-allowed}input,select{padding:9px;border:1px solid #b8c9e4;border-radius:9px;max-width:100%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button.active{background:#0f766e}.hidden{display:none}.note{background:#eff6ff;border-left:5px solid #60a5fa;padding:13px;border-radius:8px;margin:12px 0}.strip{display:flex;gap:3px;margin:10px 0;max-width:600px}.cell{height:30px;flex:1;background:#e8edf5;border:1px solid #c7d2e2}.cell.on{background:#38bdf8}.example{font-size:1.3rem;font-weight:700}.question{border:1px solid #dce6f5;padding:17px;border-radius:14px;margin:13px 0}.question input{width:140px}.good{color:#15803d;font-weight:bold}.bad{color:#b91c1c;font-weight:bold}.progress{font-size:.9rem;color:#475569}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{border:1px solid #dbeafe;border-radius:12px;padding:15px}.digit{font-family:monospace;font-size:1.5rem;line-height:1.5;white-space:pre;text-align:right;display:inline-block;background:#f8fafc;padding:12px 20px;border-radius:10px}.muted{color:#64748b}@media print{.tabs,.controls,button{display:none!important}body{background:white}.panel{box-shadow:none;border:1px solid #ddd}}</style></head><body><div class="wrap"><header><h1>🔢 소수 탐험대</h1><div>초등학교 4학년 | 개념 학습 → 개념 확인 → 문제 풀이 → 오답 복습</div></header><nav class="tabs"><button class="active" data-tab="learn">① 개념 학습</button><button data-tab="check">② 개념 확인</button><button data-tab="practice">③ 문제 풀이</button></nav><section id="learn" class="panel"><h2>그림으로 배우는 소수</h2><div class="grid" id="lessons"></div><div id="lessonBody"></div><div class="controls"><button id="prevLesson" class="secondary">이전 개념</button><button id="nextLesson">다음 개념</button><button id="toCheck">개념 확인으로 이동 →</button></div></section><section id="check" class="panel hidden"><h2>개념 확인 퀴즈</h2><p>핵심 개념 5문제를 풀고 채점해 보세요. 틀렸다면 설명을 다시 살펴보세요.</p><div id="checks"></div><button id="gradeChecks">개념 확인 채점</button><div id="checkResult" aria-live="polite"></div><button id="toPractice" disabled>문제 풀이로 이동 →</button></section><section id="practice" class="panel hidden"><h2>소수 계산 실력 기르기</h2><div class="controls row"><label>학습 범위 <select id="topic"><option value="mix">덧셈·뺄셈 혼합</option><option value="add">덧셈</option><option value="sub">뺄셈</option><option value="noCarry">받아올림·받아내림 없는 계산</option><option value="carry">받아올림·받아내림 있는 계산</option></select></label><label>난이도 <select id="level"><option value="easy">기초(소수 첫째 자리)</option><option value="medium" selected>보통(소수 둘째 자리)</option><option value="hard">도전(자릿수 다른 계산)</option></select></label><label>문제 수 <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select></label><button id="newSet">새 문제 만들기</button></div><div class="note">답을 직접 입력하세요. 소수점을 정확히 찍어야 합니다. 예: 2.35</div><div id="questions"></div><div class="controls"><button id="grade">자동 채점하기</button><button id="retry" class="secondary">틀린 문제 다시 풀기</button><button id="print" class="secondary">인쇄하기</button></div><div id="result" aria-live="polite"></div></section><footer class="muted">로그인·인터넷 연결이 필요하지 않습니다. 학습 결과는 외부로 전송되지 않습니다.</footer></div><script>
const $=id=>document.getElementById(id);let lesson=0,problems=[],graded=false,wrong=[];const lessons=[{title:'소수의 자리값',html:`<p>소수점 오른쪽 첫째 자리는 <b>소수 첫째 자리(0.1)</b>, 둘째 자리는 <b>소수 둘째 자리(0.01)</b>입니다.</p><div class="example">2.35 = 2 + 0.3 + 0.05</div><p>아래 칸 10개 중 3개가 색칠되면 0.3입니다.</p><div id="tenths"></div><p>소수점의 위치에 따라 수의 크기가 달라집니다.</p>`},{title:'소수점 맞추기',html:`<p>소수를 더하거나 뺄 때에는 <b>소수점을 세로로 맞추고</b> 같은 자리끼리 계산합니다.</p><div class="digit">  2.35\n+ 1.40\n──────\n  3.75</div><div class="note">2.35 + 1.4에서 1.4를 1.40으로 생각하면 편리해요.</div>`},{title:'소수의 덧셈',html:`<p>오른쪽 자리부터 더하고, 10이 되면 왼쪽 자리로 <b>받아올림</b>합니다.</p><div class="digit">  1.78\n+ 0.56\n──────\n  2.34</div><p>8+6=14이므로 소수 둘째 자리에 4를 쓰고 1을 받아올립니다.</p>`},{title:'소수의 뺄셈',html:`<p>오른쪽 자리부터 빼고 부족하면 왼쪽 자리에서 <b>받아내림</b>합니다.</p><div class="digit">  4.20\n- 1.75\n──────\n  2.45</div><p>4.2는 4.20과 같습니다. 소수점을 맞추어 계산하세요.</p>`},{title:'계산 결과 확인하기',html:`<p>계산이 끝나면 <b>어림</b>하여 답이 알맞은지 확인하세요.</p><div class="example">3.48 + 2.16 = 5.64</div><p>약 3.5 + 2.2 = 5.7이므로 5.64는 자연스럽습니다.</p><div class="note">소수점은 답에서도 같은 세로줄에 놓아야 합니다.</div>`}];
function show(tab){document.querySelectorAll('section.panel').forEach(s=>s.classList.toggle('hidden',s.id!==tab));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));function renderLesson(){ $('lessons').innerHTML=lessons.map((x,i)=>`<div class="card" style="${i===lesson?'border:2px solid #2563eb':''}"><button class="secondary" onclick="lesson=${i};renderLesson()">${i+1}. ${x.title}</button></div>`).join('');$('lessonBody').innerHTML=lessons[lesson].html;if(lesson===0)$('tenths').innerHTML='<div class="strip">'+Array.from({length:10},(_,i)=>`<div class="cell ${i<3?'on':''}"></div>`).join('')+'</div>';$('prevLesson').disabled=lesson===0;$('nextLesson').disabled=lesson===lessons.length-1} $('prevLesson').onclick=()=>{lesson--;renderLesson()};$('nextLesson').onclick=()=>{lesson++;renderLesson()};$('toCheck').onclick=()=>show('check');
const checks=[{q:'0.1은 소수 몇째 자리의 값인가요?',options:['첫째 자리','둘째 자리','셋째 자리'],a:0,why:'0.1은 소수 첫째 자리의 값입니다.'},{q:'2.5 + 1.23을 계산할 때 2.5는 어떻게 생각하면 좋나요?',options:['2.05','2.50','25.0'],a:1,why:'2.5와 2.50은 같은 수입니다.'},{q:'1.7 + 0.8의 값은?',options:['1.15','2.5','2.15'],a:1,why:'0.7+0.8=1.5이므로 2.5입니다.'},{q:'4.2 - 1.7의 값은?',options:['2.5','3.5','2.15'],a:0,why:'4.2-1.7=2.5입니다.'},{q:'소수의 덧셈과 뺄셈에서 맞춰야 하는 것은?',options:['맨 왼쪽 숫자','소수점','맨 오른쪽 숫자'],a:1,why:'소수점을 맞추어 같은 자리끼리 계산합니다.'}];function renderChecks(){ $('checks').innerHTML=checks.map((x,i)=>`<div class="question"><b>${i+1}. ${x.q}</b><div>${x.options.map((o,j)=>`<label style="display:block;margin:8px 0"><input type="radio" name="c${i}" value="${j}"> ${o}</label>`).join('')}</div><div id="cf${i}"></div></div>`).join('')} $('gradeChecks').onclick=()=>{let n=0;checks.forEach((x,i)=>{const s=document.querySelector(`input[name=c${i}]:checked`);let ok=s&&+s.value===x.a;if(ok)n++;$('cf'+i).innerHTML=`<p class="${ok?'good':'bad'}">${ok?'정답!':'다시 확인해요.'} ${x.why}</p>`});$('checkResult').innerHTML=`<h3>${n}/5문제 정답</h3><p>${n===5?'모든 개념을 확인했어요! 문제 풀이로 넘어가세요.':'틀린 내용을 다시 읽고 재도전하세요.'}</p>`;$('toPractice').disabled=n!==5};$('toPractice').onclick=()=>{show('practice');if(!problems.length)newSet()};
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function makeOne(){let lev=$('level').value,topic=$('topic').value,scale=lev==='easy'?10:100;let op=topic==='add'?'+':topic==='sub'?'-':Math.random()<.5?'+':'-';let a,b,tries=0;do{a=rand(scale/2,scale*8);b=rand(1,scale*6);if(op==='-'&&a<b)[a,b]=[b,a];if(lev==='hard'&&Math.random()<.6){a=Math.round(a/10)*10}tries++;let lastA=a%10,lastB=b%10;let special=op==='+'?lastA+lastB>=10:lastA<lastB;if(topic==='carry'&&!special)continue;if(topic==='noCarry'&&special)continue;break}while(tries<300);return {a,b,op,scale,answer:(op==='+'?a+b:a-b)/scale,entered:'',correct:null}}function fmt(v){return String(Number(v.toFixed(2)))}function newSet(){problems=Array.from({length:+$('count').value},makeOne);graded=false;wrong=[];renderProblems();$('result').innerHTML=''}function renderProblems(){ $('questions').innerHTML=problems.map((p,i)=>`<div class="question"><div class="row"><b>${i+1}.</b><span class="example">${fmt(p.a/p.scale)} ${p.op} ${fmt(p.b/p.scale)} = </span><input type="text" inputmode="decimal" autocomplete="off" aria-label="${i+1}번 정답" id="a${i}" value="${p.entered}" placeholder="답 입력"></div><div id="f${i}">${graded?feedback(p):''}</div></div>`).join('');problems.forEach((p,i)=>{$('a'+i).oninput=e=>{p.entered=e.target.value.trim();p.correct=null;$('f'+i).innerHTML=''}})}function feedback(p){return `<p class="${p.correct?'good':'bad'}">${p.correct?'정답입니다!':'다시 도전해 보세요.'} ${p.correct?'':`정답: ${fmt(p.answer)} · 소수점을 맞추어 같은 자리끼리 계산하세요.`}</p>`}function grade(){let score=0;problems.forEach((p,i)=>{let s=$('a'+i).value.trim();p.entered=s;p.correct=s!==''&&/^\d+(\.\d+)?$/.test(s)&&Math.abs(Number(s)-p.answer)<1e-9;if(p.correct)score++;$('f'+i).innerHTML=feedback(p)});graded=true;wrong=problems.filter(p=>!p.correct);$('result').innerHTML=`<h2>🎉 ${score}/${problems.length}문제 정답 · ${Math.round(score/problems.length*100)}점</h2><p>${wrong.length?'틀린 문제를 다시 풀어 보세요.':'모든 문제를 맞혔어요! 새로운 문제에 도전하세요.'}</p>`}$('newSet').onclick=newSet;$('grade').onclick=grade;$('retry').onclick=()=>{if(!graded){$('result').textContent='먼저 채점해 주세요.';return}if(!wrong.length){$('result').textContent='틀린 문제가 없습니다.';return}problems=wrong.map(p=>({...p,entered:'',correct:null}));graded=false;renderProblems();$('result').innerHTML='오답만 모았습니다. 다시 풀어 보세요.'};$('print').onclick=()=>window.print();renderLesson();renderChecks();newSet();</script></body></html>
